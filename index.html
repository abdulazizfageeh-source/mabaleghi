<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<link rel="manifest" href="manifest.webmanifest">
<title>مبالغي</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172b4d;background:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;padding-bottom:88px}
header{background:#102a43;color:white;padding:26px 18px 20px}
header h1{margin:0;font-size:25px}
header small{color:#b9cbdc}
main{max-width:720px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 3px 15px #102a430a}
.muted{color:#687b8e;font-size:13px}
.big{font-size:28px;font-weight:750;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f3f7fa;border-radius:12px;padding:13px}
.stat b{display:block;margin-top:8px;font-size:19px}
button,input,select{font:inherit}
button{border:0;background:#146c87;color:white;padding:11px 14px;border-radius:11px;cursor:pointer}
button.secondary{background:#e9f1f5;color:#194a61}
button.danger{background:#fff0f0;color:#a33333}
button.small{padding:7px 10px;font-size:13px}
input,select{width:100%;padding:11px;border:1px solid #d8e2e9;border-radius:10px;background:white;min-width:0}
label{display:block;font-size:13px;color:#536b7f;margin:10px 0 5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f4}
.line:last-child{border:0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce5eb;display:flex;justify-content:space-around;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:5}
.tabs button{background:transparent;color:#637b8d;flex:1}
.tabs button.active{color:#076582;font-weight:bold;background:#edf6fa}.tabs button{font-size:13px;padding:10px 4px}
.tag{font-size:12px;background:#e8f5f0;color:#14684b;border-radius:30px;padding:5px 8px}
.neg{color:#b42318}
.bar{height:9px;background:#e8eef3;border-radius:20px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:#1a9a78}
.note{font-size:12px;color:#718497;line-height:1.7}
dialog{position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);margin:0;border:0;border-radius:18px;padding:18px;width:min(94vw,480px);max-height:85dvh;overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:#071b2ca8}
h2{font-size:19px;margin:0 0 12px}.modalClose{position:absolute;left:10px;top:10px;width:34px;height:34px;padding:0;border-radius:50%;background:#eef3f6;color:#36576a;font-size:22px;line-height:34px}
h3{font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
[hidden]{display:none!important}
.installments{border:1px solid #e0e8ee;border-radius:12px;padding:10px;margin-top:12px}
.installments summary{font-weight:650;color:#146c87;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.installments summary::after{content:'⌄';font-size:20px}
.installments[open] summary::after{content:'⌃'}
.installments .installment-row{border-top:1px solid #edf1f4;margin-top:10px;padding-top:10px}
.installments select{margin-top:5px}
.pill{font-size:12px;border-radius:30px;padding:4px 8px;background:#edf3f7;color:#36586a}
.quickAdd{position:fixed;bottom:calc(82px + env(safe-area-inset-bottom));right:16px;z-index:4;border-radius:28px;padding:13px 19px;box-shadow:0 5px 22px #1638494d}
.item-list-pad{height:67px}
.card-emphasis{border:1px solid #acd7d7}
.full-line{margin-top:10px;padding-top:10px;border-top:1px solid #ecf0f4}
.donut-layout{display:flex;align-items:center;justify-content:center;gap:23px;flex-wrap:wrap}
.donut{width:154px;height:154px;border-radius:50%;position:relative;flex-shrink:0;display:grid;place-items:center}
.donut::before{content:"";position:absolute;inset:22px;border-radius:50%;background:white}
.donut-content{position:relative;z-index:1;text-align:center;line-height:1.5}
.legend{display:grid;gap:9px;flex:1;min-width:142px}
.legend-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.legend-title{display:flex;align-items:center;gap:7px}
.legend-dot{width:11px;height:11px;flex-shrink:0;border-radius:50%}
.goal-summary{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.goal-arc{display:block;width:min(190px,46vw);height:auto}
.goal-group{margin-top:12px}
.goal-group summary{font-weight:700}
.goal-entry{padding:11px 0;border-top:1px solid #edf1f4}
.goal-entry:first-of-type{margin-top:10px}
.goal-entry-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.goal-entry-head select{width:94px;padding:7px;font-size:13px;flex-shrink:0}
.goal-meter{margin-top:9px;height:6px;border-radius:12px;background:#e8eef3;overflow:hidden}
.goal-meter>div{height:100%;background:#1b947c;border-radius:12px}
.goal-entry details{margin-top:7px}
.goal-entry details summary{font-size:12px;color:#146c87;font-weight:500;cursor:pointer}
.goal-entry .actions{margin:6px 0 3px}
.small-select{font-size:13px}
@media(max-width:360px){.two{grid-template-columns:1fr}.donut{width:135px;height:135px}}
/* متابعة الانتظام، مفصولة عن مجموع الديون وعن تقييمات الجهات الائتمانية */
.stability{border:1px solid #d5e7e2}
.stability-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stability-state{font-size:12px;border-radius:999px;padding:6px 10px;background:#fff2dc;color:#8b5700;font-weight:700}
.stability-state.clear{background:#e4f5ed;color:#176645}
.stability-state.unknown{background:#edf2f6;color:#526779}
.stability .stat b{font-size:18px}
.stability h4{margin:16px 0 7px;font-size:14px}
.stability .followup{margin-top:13px;padding:11px;border-radius:11px;background:#f3f7fa}
.stability .progress{display:flex;gap:9px;align-items:center;justify-content:space-between;margin-top:14px}
.stability .smallbar{height:9px;background:#e9eef2;overflow:hidden;border-radius:8px;margin:8px 0}
.stability .smallbar>div{background:#218c78;height:100%;min-width:0;max-width:100%}
.stability .hint{font-size:12px;color:#677b89;line-height:1.7}
.stability .due-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf1f4}
.stability .due-row:last-child{border-bottom:0}

/* قائمة اختيار الخطط: الاسم واضح، والرصيد أسفله بلا وصف */
.plan-select-native{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;overflow:hidden;clip-path:inset(50%);padding:0!important;border:0!important}
.plan-picker{position:relative;width:100%;margin-top:5px}
.plan-picker-trigger{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;min-height:63px;padding:11px 14px;background:#fff;color:#172b4d;border:1px solid #d8e2e9;border-radius:13px;text-align:right;box-shadow:0 1px 3px #102a4305}
.plan-picker-trigger:focus-visible{outline:2px solid #146c87;outline-offset:2px}
.plan-picker-title,.plan-option-title{display:block;font-weight:750;font-size:16.5px;line-height:1.45;overflow-wrap:anywhere}
.plan-picker-balance,.plan-option-balance{display:block;color:#96a5b3;font-size:12px;font-weight:400;line-height:1.6;margin-top:2px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.plan-picker-chevron{font-size:19px;color:#8b9ba9;flex-shrink:0}
#planPickerDialog{inset:auto 0 0;transform:none;margin:0 auto;width:min(100%,520px);max-height:75dvh;padding:16px 16px max(18px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;overscroll-behavior:contain}
#planPickerDialog .plan-choice{width:100%;border:0;border-bottom:1px solid #eff2f5;background:#fff;color:#172b4d;border-radius:0;display:block;text-align:right;padding:13px 10px;min-height:65px}
#planPickerDialog .plan-choice[aria-selected="true"]{background:#f1f8fa;border-radius:12px}
#planPickerDialog .plan-choice:disabled{opacity:.42}
#planPickerDialog .plan-option-title{font-size:17px}
#planPickerDialog h2{padding-left:43px}
#planPickerDialog .plan-option-list{overflow-y:auto;max-height:57dvh;overscroll-behavior:contain}
#planPickerDialog .plan-chooser-close{float:left;background:#e9f1f5;color:#194a61;padding:8px 13px}
/* مؤشر الاستقرار والأهداف التلقائية */
.health-card{border:1px solid #d4e4df}
.health-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.health-main{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.health-meter{width:152px;max-width:42vw;height:auto;flex:none}
.health-summary{flex:1;min-width:130px}
.health-summary .big{font-size:25px;margin:2px 0}
.health-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.health-metric{border-radius:12px;background:#f4f7f8;padding:10px;min-width:0}
.health-metric .metric-number{font-size:20px;font-weight:750;margin:3px 0;font-variant-numeric:tabular-nums}
.health-metric small{display:block;font-size:12px;color:#6d8292}
.health-tag{background:#edf5f1;color:#24745a;padding:4px 9px;font-size:11px;border-radius:16px}
.health-target{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px}
.auto-goal-progress{font-size:18px;font-weight:750;white-space:nowrap;color:#146c87}
.goal-entry-head>div{min-width:0}
.health-metric .mini-bar{height:5px;border-radius:8px;background:#e2eaf0;overflow:hidden;margin-top:7px}
.health-metric .mini-bar>div{height:100%;background:#259278}
@media(max-width:360px){.health-meter{width:132px}.health-metric .metric-number{font-size:17px}}
.health-finances{background:#f5f8fa;border-radius:12px;padding:8px 12px;margin-top:10px}
.health-finance-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:13px}
.health-finance-row+ .health-finance-row{border-top:1px solid #e7edf1}
.health-finance-row b{white-space:nowrap;font-variant-numeric:tabular-nums}
.health-finance-row.health-net{font-weight:650}
.liquidity-dues{max-height:260px;overflow:auto;overscroll-behavior:contain;margin-top:7px}
.liquidity-dues .line{font-size:12px}
.liquidity-dues .line>div{min-width:0}
.liquidity-dues .line>b{white-space:nowrap}

/* البنود التي أغلقت بالكامل: شريط رمادي مختصر، تفاصيله بالضغط */
.card.settled-card{padding:0;background:#eff2f5;border:1px solid #d9e0e5;box-shadow:none;overflow:hidden}
.settled-details{margin:0}
.settled-details>.settled-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;padding:13px 15px;cursor:pointer;list-style:none;color:#465565}
.settled-summary::-webkit-details-marker{display:none}
.settled-summary::marker{content:''}
.settled-summary:focus-visible{outline:2px solid #657789;outline-offset:-3px;border-radius:12px}
.settled-title{display:block;font-size:15px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.settled-end{display:inline-flex;align-items:center;gap:10px;flex-shrink:0;color:#607080;font-size:12px;font-weight:700}
.settled-end .settled-check{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#dbe3e8;color:#536779;font-size:13px}
.settled-end .settled-caret{display:inline-block;color:#7a8995;font-size:17px;font-weight:400;transition:transform .15s ease}
.settled-details[open] .settled-caret{transform:rotate(180deg)}
.settled-details[open]>.settled-summary{border-bottom:1px solid #d7dfe6}
.settled-body{padding:12px 15px 15px;background:#f8fafb}
.settled-body .stat{background:#edf2f5}
.settled-body .installments{background:#fff}
@media(max-width:360px){.settled-end{gap:6px;font-size:11px}.settled-details>.settled-summary{padding:12px}}

/* الدفعات المسددة: مختصرة ورمادية أسفل الاستحقاقات، ويمكن فتح تفاصيلها */
.installment-completed-heading{margin:15px 1px 6px;color:#70808c;font-size:12px;font-weight:700}
.installments .installment-row.unpaid-installment{border-top:1px solid #edf1f4;margin-top:10px;padding-top:10px}
.paid-installment{background:#eff2f5;border:1px solid #dce3e8;border-radius:12px;margin-top:7px;overflow:hidden;color:#485867}
.paid-installment>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:10px 12px;font-size:13px;cursor:pointer;color:#465565}
.paid-installment>summary::-webkit-details-marker{display:none}
.paid-installment>summary::marker{content:''}
.paid-installment>summary::after{display:none}
.paid-installment>summary:focus-visible{outline:2px solid #657789;outline-offset:-2px}
.paid-installment-label{min-width:0;font-weight:650;overflow-wrap:anywhere}
.paid-installment-status{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;font-size:12px;color:#607180;font-weight:650}
.paid-installment-check{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#dce5eb;color:#506776;font-size:12px}
.paid-installment-caret{color:#7b8995;font-size:16px;transition:transform .15s}
.paid-installment[open] .paid-installment-caret{transform:rotate(180deg)}
.paid-installment-body{padding:4px 12px 12px;border-top:1px solid #dce3e8;background:#f9fafb}
.installments .paid-installment-body .installment-row{margin-top:0;padding-top:5px;border:0}
.paid-installment-body .two{margin-top:3px}
</style>
</head>
<body>
<header><h1>مبالغي</h1><small>مبالغك وخطط السداد، ببساطة</small></header>
<main id="view"></main>
<nav class="tabs">
<button id="tab-dashboard" onclick="go('dashboard')">الداشبورد</button>
<button id="tab-plans" onclick="go('plans')">الخطط</button>
<button id="tab-items" onclick="go('items')">البنود</button>
<button id="tab-goals" onclick="go('goals')">الأهداف</button>
</nav>
<dialog id="modal"></dialog>
<dialog id="planPickerDialog" aria-label="اختيار خطة"></dialog>
<input id="importDataFile" type="file" accept=".json,application/json" style="display:none" onchange="readImportFile(this)">
<script>
const KEY='mabaleghi-v1';
const GOALS_KEY='mabaleghi-goals-v1';
const STABILITY_KEY='mabaleghi-stability-v1';
const GOAL_METRICS=['stability','arrears','regularity','cards','liquidity','month','payoff'];
const GOAL_METRIC_LABELS={stability:'الاستقرار المالي',arrears:'تسوية المتأخرات',regularity:'الانتظام 3 أشهر',cards:'انتظام البطاقات',liquidity:'تحقيق حد السيولة',month:'شهر بدون تأخير',payoff:'سداد بند محدد'};
const goalPresets=[
  {title:'الوصول إلى الاستقرار المالي',type:'strategic',horizon:'long',metric:'stability'},
  {title:'تسوية المتأخرات',type:'operational',horizon:'short',metric:'arrears'},
  {title:'شهر كامل دون تأخير',type:'operational',horizon:'short',metric:'month'},
  {title:'معالجة مستحقات البطاقات',type:'operational',horizon:'short',metric:'cards'},
  {title:'ثلاثة أشهر من انتظام الأقساط',type:'operational',horizon:'medium',metric:'regularity'},
  {title:'تحقيق حد السيولة',type:'operational',horizon:'short',metric:'liquidity'},
  {title:'إغلاق تمويل محدد',type:'operational',horizon:'medium',metric:'payoff'}
];
const LEGACY_GOAL_METRIC={'توفير مبلغ للطوارئ':'liquidity'};
function inferGoalMetric(g){return GOAL_METRICS.includes(g.metric)?g.metric:(goalPresets.find(x=>x.title===g.title)?.metric||LEGACY_GOAL_METRIC[g.title]||'')}
function validGoals(data){
  if(!Array.isArray(data)||data.length>500)throw new Error('قائمة الأهداف غير صالحة');
  const seen=new Set();
  return data.map(g=>{
    if(!g||typeof g!=='object'||typeof g.id!=='string'||!/^[a-zA-Z0-9_-]{1,100}$/.test(g.id)||seen.has(g.id))throw new Error('معرّف هدف غير صالح أو مكرر');
    seen.add(g.id);
    if(typeof g.title!=='string'||!g.title.trim()||g.title.length>150)throw new Error('عنوان الهدف غير صالح');
    if(!['operational','strategic'].includes(g.type)||!['short','medium','long'].includes(g.horizon))throw new Error('تصنيف الهدف غير صالح');
    const previous=Number(g.progress??0);
    if(!Number.isInteger(previous)||previous<0||previous>100)throw new Error('نسبة قديمة غير صالحة');
    const deadline=g.deadline||'';
    if(deadline && !/^\d{4}-\d{2}-\d{2}$/.test(deadline))throw new Error('تاريخ الهدف غير صالح');
    if(g.metric && !GOAL_METRICS.includes(g.metric))throw new Error('مؤشر الهدف غير معروف');
    return {id:g.id,title:g.title.trim(),type:g.type,horizon:g.horizon,progress:previous,deadline,
      parentId:typeof g.parentId==='string'?g.parentId:'',metric:inferGoalMetric(g),itemId:typeof g.itemId==='string'?g.itemId:''};
  });
}
function validateStabilitySettings(v){
  const target=Number(v.target||0),peak=Number(v.peak||0);
  if(!Number.isFinite(target)||target<0||target>10000000||!Number.isFinite(peak)||peak<0||peak>100)throw new Error('إعدادات السيولة غير صالحة');
  return {target:cents(target),peak:Math.round(peak)};
}
function loadStabilitySettings(){
  try{
    const v=JSON.parse(localStorage.getItem(STABILITY_KEY))||{};
    const target=Number(v.target||0),peak=Number(v.peak||0);
    return {target:Number.isFinite(target)&&target>0&&target<=10000000?Math.round(target*100)/100:0,
      peak:Number.isFinite(peak)&&peak>=0&&peak<=100?peak:0};
  }catch{return {target:0,peak:0}}
}
let stabilitySettings=loadStabilitySettings();
function saveStabilitySettings(){localStorage.setItem(STABILITY_KEY,JSON.stringify(stabilitySettings));render()}

function loadGoals(){try{return validGoals(JSON.parse(localStorage.getItem(GOALS_KEY))||[])}catch{return []}}
let goals=loadGoals();
function saveGoals(){localStorage.setItem(GOALS_KEY,JSON.stringify(goals));render()}


function localToday(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function emptyDb(){return {plans:[],items:[],payments:[]}}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY))||emptyDb();
    x.plans=Array.isArray(x.plans)?x.plans:[];
    x.items=Array.isArray(x.items)?x.items:[];
    x.payments=Array.isArray(x.payments)?x.payments:[];
    x.plans.forEach(p=>{
      if(!p.date) p.date=(p.month||localToday().slice(0,7))+'-01';
      p.month=p.date.slice(0,7);
      p.carry=Number(p.carry||0);
      p.amount=Number(p.amount||0);
    });
    x.items.forEach(i=>{
      i.amount=Number(i.amount||0);
      i.schedule=Array.isArray(i.schedule)?i.schedule:[];
    });
    return x;
  }catch{return emptyDb()}
}
let db=load(),tab='dashboard',period='month',anchor=localToday().slice(0,7),active=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function id(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'mab-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function money(n){return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2})+' ⃁'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ym(s){return String(s||'').slice(0,7)}
function planDate(p){return p?.date||((p?.month||localToday().slice(0,7))+'-01')}
function planMonth(p){return planDate(p).slice(0,7)}
function monthName(s){return new Date(s+'-15T12:00:00').toLocaleDateString('ar-SA',{month:'long',year:'numeric',calendar:'gregory'})}
function dateName(s){return new Date(s+'T12:00:00').toLocaleDateString('ar-SA',{day:'numeric',month:'long',year:'numeric',calendar:'gregory'})}
function addMonths(s,n){
  let [y,m]=s.split('-').map(Number);
  let total=y*12+(m-1)+n, yy=Math.floor(total/12), mm=(total%12+12)%12+1;
  if(total<0 && total%12) yy=Math.floor(total/12);
  return `${yy}-${String(mm).padStart(2,'0')}`;
}
function paidFor(item){return db.payments.filter(p=>p.itemId===item.id).reduce((s,p)=>s+Number(p.amount||0),0)}
function totalPaid(p){return db.payments.filter(x=>x.planId===p.id).reduce((s,x)=>s+Number(x.amount||0),0)}
function outgoingCarry(planId,excludePlanId=''){
  return db.plans.filter(p=>p.id!==excludePlanId && p.carryFromPlanId===planId).reduce((s,p)=>s+Number(p.carry||0),0)
}
function planMoney(p){return Number(p.amount||0)+Number(p.carry||0)}
function planBalance(p){return planMoney(p)-outgoingCarry(p.id)-totalPaid(p)}
/* رصيد الخطة حتى تاريخ محدد: لا تُخصم حوالة أو دفعة مؤرخة بالمستقبل من النقد الحالي. */
function planBalanceAt(p,asOf){
  const spent=db.payments.filter(x=>x.planId===p.id&&x.date<=asOf).reduce((sum,x)=>sum+Number(x.amount||0),0);
  const transferred=db.plans.filter(x=>x.carryFromPlanId===p.id&&planDate(x)<=asOf).reduce((sum,x)=>sum+Number(x.carry||0),0);
  return cents(planMoney(p)-spent-transferred);
}
function cashOnHandAt(asOf){
  const plans=db.plans.filter(p=>planDate(p)<=asOf);
  return plans.length?cents(plans.reduce((sum,p)=>sum+planBalanceAt(p,asOf),0)):null;
}
function remainingAt(item,asOf){
  return Math.max(0,Number(item.amount||0)-db.payments.filter(p=>p.itemId===item.id&&(!asOf||p.date<=asOf)).reduce((sum,p)=>sum+Number(p.amount||0),0));
}
function availableForCarry(sourceId,targetId=''){
  const source=db.plans.find(p=>p.id===sourceId);
  if(!source)return 0;
  let v=planBalance(source);
  const target=db.plans.find(p=>p.id===targetId);
  if(target && target.carryFromPlanId===sourceId) v+=Number(target.carry||0);
  return v;
}
function remaining(i){return Math.max(0,Number(i.amount||0)-paidFor(i))}
function isCard(i){return i?.type==='card'}
function cents(v){return Math.round((Number(v)||0)*100)/100}
function cardInstallmentId(item,month){return `card_${item.id}_${month.replace('-','')}`}
function monthEndDay(month){const [year,m]=month.split('-').map(Number);return new Date(year,m,0).getDate()}
/*
  For cards the first minimum is a fixed statement amount. Later minimums are
  5% of projected outstanding balances. A projection assumes each scheduled
  minimum is paid, unless a larger actual payment has been recorded that month.
  It does not include new purchases, bank fees or interest. Actual payment
  status is never guessed: it comes only from db.payments.
*/
function itemSchedule(item,asOf=''){
  if(!isCard(item))return item.schedule||[];
  const first=(item.schedule||[])[0];
  if(!first||!first.month)return [];
  let balance=cents(item.amount),start=first.month;
  const byPaidMonth={};
  for(const p of db.payments.filter(p=>p.itemId===item.id&&(!asOf||p.date<=asOf))){
    const month=ym(p.date);
    byPaidMonth[month]=cents((byPaidMonth[month]||0)+Number(p.amount||0));
  }
  const months=[];
  const dueDay=first.date?Number(first.date.slice(-2)):0;
  const rate=Number(item.cardRate??5);
  for(let k=0;k<60&&balance>=0.01;k++){
    const month=addMonths(start,k);
    const due=k===0?cents(Math.min(balance,first.amount)):cents(Math.min(balance,balance*rate/100));
    if(due<0.01)break;
    const date=dueDay?`${month}-${String(Math.min(dueDay,monthEndDay(month))).padStart(2,'0')}`:'';
    months.push(k===0?{...first,amount:due,date}:{id:cardInstallmentId(item,month),month,date,label:'الحد الأدنى المتوقع — 5% من الرصيد المتبقي',kind:item.installmentKinds?.[cardInstallmentId(item,month)]||'regular',fundingPlanId:item.installmentFunding?.[cardInstallmentId(item,month)]||'',amount:due});
    const actuallyPaid=byPaidMonth[month]||0;
    balance=cents(Math.max(0,balance-Math.max(due,actuallyPaid)));
  }
  return months;
}
function cardScheduleBalances(item,asOf=''){
  const rows=itemSchedule(item,asOf);
  if(remainingAt(item,asOf)<0.005){
    return Object.fromEntries(rows.map(d=>[d.id,{paid:d.amount,remaining:0}]));
  }
  const actualForRow={};
  const validIds=new Set(rows.map(d=>d.id));
  for(const p of db.payments.filter(p=>p.itemId===item.id&&(!asOf||p.date<=asOf))){
    const rowId=p.installmentId && validIds.has(p.installmentId)
      ? p.installmentId
      : (ym(p.date)===rows[0]?.month?rows[0]?.id:cardInstallmentId(item,ym(p.date)));
    if(rowId)actualForRow[rowId]=cents((actualForRow[rowId]||0)+Number(p.amount||0));
  }
  const result={};
  for(const d of rows){
    const paid=Math.min(d.amount,actualForRow[d.id]||0);
    result[d.id]={paid,remaining:cents(Math.max(0,d.amount-paid))};
  }
  return result;
}
function installmentKind(d){
  if(d?.kind==='arrears')return 'arrears';
  if(d?.kind==='regular')return 'regular';
  return /متأخر/.test(String(d?.label||''))?'arrears':'regular';
}
function installmentKindLabel(d){return installmentKind(d)==='arrears'?'متأخرات':'قسط عادي'}
function linkedPlanId(item,inst){return String(inst?.fundingPlanId||item?.installmentFunding?.[inst?.id]||'')}
function commitmentsForPlan(planId){
  let total=0;
  for(const i of db.items){
    const balances=scheduleBalances(i);
    for(const d of itemSchedule(i)){
      if(linkedPlanId(i,d)===planId)total+=Math.max(0,Number(balances[d.id]?.remaining??d.amount??0));
    }
  }
  return cents(total);
}
function unallocatedInPlan(p){return cents(planBalance(p)-commitmentsForPlan(p.id))}
function fundingLabel(id){return id?planLabel(db.plans.find(p=>p.id===id)):'غير مرتبطة بخطة'}
let planAvailabilityCache=new Map();
function cachedUnallocated(p){
  if(!planAvailabilityCache.has(p.id))planAvailabilityCache.set(p.id,unallocatedInPlan(p));
  return planAvailabilityCache.get(p.id);
}
function fundingSelectOptions(selectedId='',emptyLabel='غير مرتبطة بخطة'){
  return `<option value="" ${!selectedId?'selected':''}>${emptyLabel}</option>`+
    [...db.plans].sort((a,b)=>planDate(a).localeCompare(planDate(b))).map(p=>`<option value="${p.id}" ${selectedId===p.id?'selected':''}>${esc(planLabel(p))}</option>`).join('');
}

/* تبقى عناصر select المصدر الرسمي للبيانات؛ نعرض لها اختيارًا بصريًا من سطرين. */
let pendingPlanSelect=null;
function pickerDisplay(sel){
  const selected=sel.options[sel.selectedIndex];
  const p=db.plans.find(x=>x.id===sel.value);
  const title=p?planLabel(p):(selected?.textContent||'اختر خطة');
  const balance=p?`<span class="plan-picker-balance">${money(planBalance(p))}</span>`:'';
  return `<span><span class="plan-picker-title">${esc(title)}</span>${balance}</span><span class="plan-picker-chevron" aria-hidden="true">⌄</span>`;
}
function syncPlanPicker(sel){
  const picker=sel.closest('.plan-picker');
  if(!picker)return;
  const trigger=picker.querySelector('.plan-picker-trigger');
  if(trigger)trigger.innerHTML=pickerDisplay(sel);
}
function decoratePlanSelectors(root=document){
  root.querySelectorAll('select.plan-select-native').forEach(sel=>{
    if(sel.closest('.plan-picker')){syncPlanPicker(sel);return;}
    const wrapper=document.createElement('div');
    wrapper.className='plan-picker';
    sel.parentNode.insertBefore(wrapper,sel);
    wrapper.appendChild(sel);
    const trigger=document.createElement('button');
    trigger.type='button';
    trigger.className='plan-picker-trigger';
    trigger.setAttribute('aria-haspopup','dialog');
    trigger.setAttribute('aria-label','اختيار الخطة');
    trigger.addEventListener('click',()=>openPlanPicker(sel));
    wrapper.appendChild(trigger);
    syncPlanPicker(sel);
  });
}
function openPlanPicker(sel){
  const popup=document.getElementById('planPickerDialog');
  pendingPlanSelect=sel;
  const choices=Array.from(sel.options).map(opt=>{
    const p=db.plans.find(x=>x.id===opt.value);
    const name=p?planLabel(p):opt.textContent;
    const amount=p?`<span class="plan-option-balance">${money(planBalance(p))}</span>`:'';
    const idx=Array.from(sel.options).indexOf(opt);
    return `<button type="button" role="option" class="plan-choice" aria-selected="${sel.value===opt.value}" ${opt.disabled?'disabled':''} data-index="${idx}" onclick="choosePlanOption(${idx})"><span class="plan-option-title">${esc(name)}</span>${amount}</button>`;
  }).join('');
  popup.innerHTML=`<button class="plan-chooser-close" type="button" onclick="closePlanPicker()">إغلاق</button><h2>اختر الخطة</h2><div role="listbox" class="plan-option-list">${choices}</div>`;
  if(!popup.open)popup.showModal();
  const chosen=popup.querySelector('[aria-selected="true"]');
  if(chosen)chosen.scrollIntoView({block:'nearest'});
}
function closePlanPicker(){
  const popup=document.getElementById('planPickerDialog');
  if(popup.open)popup.close();
  pendingPlanSelect=null;
}
function choosePlanOption(idx){
  const sel=pendingPlanSelect;
  if(!sel)return;
  const option=sel.options[idx];
  if(!option||option.disabled)return;
  sel.value=option.value;
  closePlanPicker();
  syncPlanPicker(sel);
  sel.dispatchEvent(new Event('change',{bubbles:true}));
}

function fundingOverdrawn(){return db.plans.find(p=>commitmentsForPlan(p.id)>planBalance(p)+0.005)}
function instSortDate(d){return d.date||d.month+'-31'}
function instLabel(d){return (d.label?esc(d.label)+' — ':'')+(d.date?dateName(d.date):monthName(d.month))}
function scheduleBalances(item,asOf=''){
  if(isCard(item))return cardScheduleBalances(item,asOf);
  const explicit={};
  let general=0;
  db.payments.filter(p=>p.itemId===item.id&&(!asOf||p.date<=asOf)).forEach(p=>{
    if(p.installmentId) explicit[p.installmentId]=(explicit[p.installmentId]||0)+Number(p.amount||0);
    else general+=Number(p.amount||0);
  });
  const rows=itemSchedule(item,asOf).map((d,idx)=>({...d,_idx:idx})).sort((a,b)=>instSortDate(a).localeCompare(instSortDate(b))||a._idx-b._idx);
  const out={};
  rows.forEach(d=>{
    const linked=Math.min(Number(d.amount||0),explicit[d.id]||0);
    let left=Math.max(0,Number(d.amount||0)-linked);
    const fromGeneral=Math.min(general,left);
    general-=fromGeneral;
    left-=fromGeneral;
    out[d.id]={paid:linked+fromGeneral,remaining:left};
  });
  return out;
}
function installmentRemaining(item,instId){return scheduleBalances(item)[instId]?.remaining??0}
function due(m){
  return db.items.reduce((s,i)=>{
    const bal=scheduleBalances(i);
    return s+itemSchedule(i).filter(d=>d.month===m).reduce((a,d)=>a+(bal[d.id]?.remaining??Number(d.amount||0)),0);
  },0);
}
function planLabel(p){return p?(p.name||('خطة '+dateName(planDate(p)))):''}
function fundingPlansFor(date){
  return [...db.plans]
    .filter(p=>planDate(p)<=date && planBalance(p)>0.0001)
    .sort((a,b)=>planDate(b).localeCompare(planDate(a)));
}
function scheduledEntriesForMonth(month,excludeOriginPlanId='',notAfterDate=''){
  const rows=[];
  db.items.forEach(item=>{
    const originPlan=db.plans.find(p=>p.id===item.planId);
    const bal=scheduleBalances(item);
    itemSchedule(item).forEach(inst=>{
      const left=bal[inst.id]?.remaining??Number(inst.amount||0);
      if(inst.month===month&&left>0.0001){
        if(excludeOriginPlanId&&item.planId===excludeOriginPlanId)return;
        if(notAfterDate&&originPlan&&planDate(originPlan)>notAfterDate)return;
        rows.push({item,inst,remaining:left,originPlan});
      }
    });
  });
  return rows.sort((a,b)=>instSortDate(a.inst).localeCompare(instSortDate(b.inst)));
}
function scheduledEntriesForPlan(planId){
  const result=[];
  for(const item of db.items){
    const bal=scheduleBalances(item);
    for(const inst of itemSchedule(item)){
      if(linkedPlanId(item,inst)!==planId)continue;
      const left=bal[inst.id]?.remaining??inst.amount;
      result.push({item,inst,remaining:left});
    }
  }
  return result.sort((a,b)=>instSortDate(a.inst).localeCompare(instSortDate(b.inst)));
}
/* كل ما يخص الخطة: الربط المسبق والسداد الذي خرج منها فعلاً، حتى دون ربط الدفعة. */
function planPayments(planId){
  return db.payments.filter(p=>p.planId===planId).slice().sort((a,b)=>b.date.localeCompare(a.date));
}
function planRelatedItems(planId){
  const paidItemIds=new Set(planPayments(planId).map(x=>x.itemId));
  return db.items.filter(item=>paidItemIds.has(item.id)||itemSchedule(item).some(d=>linkedPlanId(item,d)===planId));
}
function planRelatedInstallments(item,planId){
  const paidInstIds=new Set(planPayments(planId).filter(p=>p.itemId===item.id&&p.installmentId).map(p=>p.installmentId));
  return itemSchedule(item).filter(inst=>linkedPlanId(item,inst)===planId||paidInstIds.has(inst.id))
    .sort((a,b)=>instSortDate(a).localeCompare(instSortDate(b)));
}
function planPaymentRow(payment){
  const item=db.items.find(i=>i.id===payment.itemId);
  const inst=item&&itemSchedule(item).find(d=>d.id===payment.installmentId);
  return `<div class="line"><div><b>${esc(item?.name||'بند غير موجود')}</b>
    <div class="muted">${dateName(payment.date)} · ${inst?instLabel(inst):'سداد عام للبند'}</div></div>
    <b>${money(payment.amount)}</b></div>`;
}
function button(label,fn,cl='secondary'){const noValidate=(label==='إلغاء'||label==='إغلاق')?' formnovalidate':'';return `<button type="button"${noValidate} class="${cl}" onclick="${fn}">${label}</button>`}
const expandedInstallments=new Set();
/* حالة فتح كل قسط مسدد خاصة بالعرض فقط، ولا تحفظ داخل بيانات التمويل. */
const expandedPaidInstallments=new Set();
function togglePaidInstallment(key,node){

  else expandedPaidInstallments.delete(key);

function sortedInstallmentsForDisplay(rows,balances){
  return rows.map((inst,index)=>({inst,index,left:cents(balances[inst.id]?.remaining??inst.amount)}))
    .sort((a,b)=>Number(a.left<=0.005)-Number(b.left<=0.005)
      ||instSortDate(a.inst).localeCompare(instSortDate(b.inst))||a.index-b.index);
}

/* المقياس محلي ومن بيانات المستخدم فقط؛ لا يحسب درجة سمة ولا يفترض أن جميع التمويلات أُدخلت. */
function plusCalendarDays(day,number){
  const [y,m,d]=day.split('-').map(Number);
  const next=new Date(y,m-1,d+number,12,0,0);
  return `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(next.getDate()).padStart(2,'0')}`;
}
function stabilitySummary(today=localToday()){
  const through=plusCalendarDays(today,30);
  const months=Array.from({length:3},(_,n)=>addMonths(ym(today),n));
  const calendar=months.map(month=>({month,ordinary:0,cards:0}));
  const summary={asOf:today,arrearsTotal:0,arrearsOpen:0,arrearsCount:0,lateRegular:0,lateCount:0,
    upcomingRegular:0,upcomingCard:0,cardPast:0,cardBalance:0,undated:0,
    tracked:0,nextRows:[],lateRows:[],calendar};
  for(const item of db.items){
    if(isCard(item))summary.cardBalance=cents(summary.cardBalance+remaining(item));
    const schedules=itemSchedule(item),bal=scheduleBalances(item);
    for(const inst of schedules){
      const left=cents(Math.max(0,bal[inst.id]?.remaining??Number(inst.amount||0)));
      const kind=installmentKind(inst);
      const date=inst.date&&validDate(inst.date)?inst.date:'';
      if(!isCard(item)&&kind==='arrears'){
        summary.arrearsTotal=cents(summary.arrearsTotal+Number(inst.amount||0));
        if(left>0){summary.arrearsOpen=cents(summary.arrearsOpen+left);summary.arrearsCount++;}
        summary.tracked++;
        continue;
      }
      if(left<0.005)continue;
      if(!date){if(!isCard(item))summary.undated++;continue;}
      if(!isCard(item))summary.tracked++;
      if(date<today){
        if(isCard(item))summary.cardPast=cents(summary.cardPast+left);
        else{
          summary.lateRegular=cents(summary.lateRegular+left);summary.lateCount++;
          summary.lateRows.push({name:item.name,date,amount:left});
        }
      }else if(date<=through){
        if(isCard(item))summary.upcomingCard=cents(summary.upcomingCard+left);
        else summary.upcomingRegular=cents(summary.upcomingRegular+left);
        summary.nextRows.push({name:item.name,date,amount:left,card:isCard(item)});
      }
      const slot=calendar.find(x=>x.month===inst.month);
      if(slot){if(isCard(item))slot.cards=cents(slot.cards+left);else slot.ordinary=cents(slot.ordinary+left);}
    }
  }
  summary.nextRows.sort((a,b)=>a.date.localeCompare(b.date));
  summary.lateRows.sort((a,b)=>a.date.localeCompare(b.date));
  summary.arrearsSettled=cents(Math.max(0,summary.arrearsTotal-summary.arrearsOpen));
  summary.arrearsPct=summary.arrearsTotal>0?Math.min(100,Math.round(100*summary.arrearsSettled/summary.arrearsTotal)):null;
  summary.flag=summary.arrearsOpen>0.005||summary.lateRegular>0.005?'attention':summary.tracked===0?'unknown':'clear';
  return summary;
}
function regularityPanel(){
  const st=stabilitySummary();
  const status=st.flag==='attention'?'توجد استحقاقات تحتاج مراجعة':st.flag==='clear'?'لا تظهر متأخرات غير مسددة':'بيانات غير كافية';
  const statusClass=st.flag==='clear'?'clear':st.flag==='unknown'?'unknown':'';
  return `<section class="card stability" aria-label="متابعة الانتظام المالي">
    <div class="stability-head"><h2 style="margin:0">متابعة الانتظام المالي</h2><span class="stability-state ${statusClass}">${status}</span></div>
    <p class="note">حتى ${dateName(st.asOf)}</p>
    <div class="grid">
      <div class="stat"><span class="muted">متأخرات غير البطاقات المسجلة</span><b class="${st.arrearsOpen>0?'neg':''}">${money(st.arrearsOpen)}</b></div>
      <div class="stat"><span class="muted">أقساط غير البطاقات تجاوزت موعدها</span><b class="${st.lateRegular>0?'neg':''}">${money(st.lateRegular)}</b></div>
      <div class="stat"><span class="muted">أقساط غير البطاقات خلال 30 يومًا</span><b>${money(st.upcomingRegular)}</b></div>
      <div class="stat"><span class="muted">مستحقات البطاقات خلال 30 يومًا</span><b>${money(st.upcomingCard)}</b></div>
    </div>
    ${st.arrearsPct===null?'<p class="hint">لا توجد دفعات مصنّفة «متأخرات» في السجلات الحالية.</p>':`<div class="progress"><b>تسوية المتأخرات المسجلة</b><b>${st.arrearsPct}%</b></div><div class="smallbar"><div style="width:${st.arrearsPct}%"></div></div><div class="hint">سُدد ${money(st.arrearsSettled)} من أصل ${money(st.arrearsTotal)} مصنفة متأخرات. هذه نسبة تسوية فقط وليست نسبة استقرار مالي.</div>`}
    <h4>البطاقات منفصلة عن متابعة أقساط التمويلات</h4>
    <div class="line"><span>الرصيد المتبقي للبطاقات المسجلة</span><b>${money(st.cardBalance)}</b></div>
    ${st.cardPast>0?`<p class="note neg">يوجد ${money(st.cardPast)} من دفعات بطاقات تجاوز تاريخها المُدخل، ويتطلب مراجعة كشف البنك.</p>`:''}
    <h4>الأشهر الثلاثة القادمة</h4>
    ${st.calendar.map(x=>`<div class="due-row"><span>${monthName(x.month)}</span><span><b>${money(x.ordinary)}</b><div class="muted">بطاقات: ${money(x.cards)}</div></span></div>`).join('')}

/* النسب مستمدة من السجلات؛ لا تُفترض نسبة 100% عند غياب البيانات. */
function paymentAllocation(item,asOf=''){
  const rows=itemSchedule(item,asOf).filter(d=>d.date&&validDate(d.date))
    .map(d=>({id:d.id,due:d.date,amount:Number(d.amount||0),paid:0,onTime:0})).sort((a,b)=>a.due.localeCompare(b.due));
  const byId=new Map(rows.map(d=>[d.id,d]));
  const paid=[...db.payments].filter(p=>p.itemId===item.id&&(!asOf||p.date<=asOf)).sort((a,b)=>a.date.localeCompare(b.date));
  paid.forEach(p=>{
    let amount=Number(p.amount||0);
    if(p.installmentId&&byId.has(p.installmentId)){
      const r=byId.get(p.installmentId);
      const used=Math.max(0,Math.min(amount,r.amount-r.paid));
      r.paid+=used;if(p.date<=r.due)r.onTime+=used;
      return;
    }
    // البطاقة: السداد غير المرتبط يُنسب لاستحقاق شهر العملية أولًا.
    if(isCard(item)&&!p.installmentId){
      const r=rows.find(x=>ym(x.due)===ym(p.date));
      if(r){const used=Math.max(0,Math.min(amount,r.amount-r.paid));r.paid+=used;if(p.date<=r.due)r.onTime+=used;amount-=used;}
    }
    for(const r of rows){
      if(amount<0.005)break;
      const used=Math.max(0,Math.min(amount,r.amount-r.paid));
      if(used>0){r.paid+=used;if(p.date<=r.due)r.onTime+=used;amount-=used;}
    }
  });
  return rows;
}
function financialGoalMetrics(asOf=localToday()){
  const current=ym(asOf),last3=[addMonths(current,-3),addMonths(current,-2),addMonths(current,-1)];
  const dates=[];
  for(const item of db.items){for(const x of paymentAllocation(item,asOf))dates.push({...x,itemName:item.name,card:isCard(item),kind:installmentKind(itemSchedule(item,asOf).find(d=>d.id===x.id)||{})});}
  const ordinary=dates.filter(x=>!x.card&&x.kind==='regular');
  const cardDue=dates.filter(x=>x.card&&x.due<=asOf&&x.due.slice(0,7)>=addMonths(current,-2));
  const st=stabilitySummary(asOf);
  const arrears=st.arrearsPct;
  const regularMonths=last3.map(m=>{
    const r=ordinary.filter(x=>ym(x.due)===m);
    return {month:m,hasData:r.length>0,complete:r.length>0&&r.every(x=>x.onTime+0.005>=x.amount)};
  });
  const regularity=regularMonths.some(x=>x.hasData)?Math.round(100*regularMonths.filter(x=>x.complete).length/3):null;
  const previous=last3[2];const previousRegular=ordinary.filter(x=>ym(x.due)===previous);
  const month=previousRegular.length?previousRegular.every(x=>x.onTime+0.005>=x.amount)?100:0:null;
  const cards=cardDue.length?Math.round(100*cardDue.reduce((a,x)=>a+Math.min(x.amount,x.onTime),0)/cardDue.reduce((a,x)=>a+x.amount,0)):null;
  const until=plusCalendarDays(asOf,30);
  const cashOnHand=cashOnHandAt(asOf);
  // المستحق = غير المسدد حتى نهاية الثلاثين يومًا المقبلة، بما في ذلك المتأخر السابق.
  const dueDated=cents(dates.filter(x=>x.due<=until).reduce((sum,x)=>sum+Math.max(0,x.amount-x.paid),0));
  const overdue=cents(dates.filter(x=>x.due<asOf).reduce((sum,x)=>sum+Math.max(0,x.amount-x.paid),0));
  const dueEntries=dates.filter(x=>x.due<=until&&x.amount-x.paid>0.005)
    .map(x=>({name:x.itemName,date:x.due,amount:cents(x.amount-x.paid),card:x.card,kind:x.kind}));
  const undatedEntries=[];
  for(const item of db.items){
    const b=scheduleBalances(item,asOf);
    for(const d of itemSchedule(item,asOf)){
      if((!d.date||!validDate(d.date))&&d.month<=ym(until)){
        const outstanding=cents(Math.max(0,b[d.id]?.remaining||0));
        if(outstanding>0.005)undatedEntries.push({name:item.name,date:'',month:d.month,amount:outstanding,card:isCard(item),kind:installmentKind(d)});
      }
    }
  }
  const undatedOpen=cents(undatedEntries.reduce((sum,x)=>sum+x.amount,0));
  dueEntries.push(...undatedEntries);
  dueEntries.sort((a,b)=>(a.date||a.month+'-31').localeCompare(b.date||b.month+'-31'));
  const obligationsDue=cents(dueDated+undatedOpen);
  // هذه نتيجة مستقبلية بعد الاستحقاقات، وليست الرصيد الموجود الآن في الحساب.
  const liquidityCash=cashOnHand===null?null:cents(cashOnHand-obligationsDue);
  const liquidity=stabilitySettings.target>0&&liquidityCash!==null?
    Math.round(Math.min(100,Math.max(0,liquidityCash/stabilitySettings.target*100))):null;
  const metrics={arrears,regularity,cards,liquidity,month,liquidityCash,cashOnHand,obligationsDue,overdue,undatedOpen,dueEntries,stability:null,regularMonths};
  if([arrears,regularity,cards,liquidity].every(v=>v!==null)){
    metrics.stability=Math.round(arrears*.30+regularity*.30+cards*.20+liquidity*.20);
    if(metrics.stability>stabilitySettings.peak){
      stabilitySettings.peak=metrics.stability;
      try{localStorage.setItem(STABILITY_KEY,JSON.stringify(stabilitySettings))}catch{}
    }
  }
  return metrics;
}

function submitGoal(goalId){
  const f=document.getElementById('goalForm');if(!f)return;
  const v=Object.fromEntries(new FormData(f));
  const title=(v.preset==='custom'?v.title:v.preset)||'';
  if(!title.trim()||title.trim().length>150)return alert('اختر هدفًا أو اكتب عنوانًا مناسبًا');
  if(!GOAL_METRICS.includes(v.metric))return alert('اختر مؤشرًا لحساب الإنجاز تلقائيًا');
  if(v.metric==='payoff'&&!db.items.some(i=>i.id===v.itemId))return alert('اختر بندًا لربط الهدف به');
  const record=goals.find(g=>g.id===goalId)||{id:id()};
  const changed={title:title.trim(),type:v.type,horizon:v.horizon,metric:v.metric,itemId:v.metric==='payoff'?(v.itemId||''):'',
    progress:0,deadline:v.deadline||'',parentId:v.type==='operational'?(v.parentId||''):''};
  if(!['operational','strategic'].includes(changed.type)||!['short','medium','long'].includes(changed.horizon))return alert('نوع الهدف أو مداه غير صحيح');

function goalProgress(goal,metrics=financialGoalMetrics()){
  const metric=inferGoalMetric(goal);

    const item=db.items.find(i=>i.id===goal.itemId);
    return item&&item.amount>0?Math.min(100,Math.round(paidFor(item)/item.amount*100)):null;
  }
  return metrics[metric]??null;
}

function donutChart(paid,allocated,free){
  const values=[Math.max(0,paid),Math.max(0,allocated),Math.max(0,free)].map(cents);
  const sum=values.reduce((a,b)=>a+b,0);
  if(sum<0.01)return '<p class="note">أنشئ خطة وأضف بنودًا لتظهر نسب توزيع الأموال.</p>';
  const a=values[0]/sum*100,b=values[1]/sum*100, progress=Math.round((values[0]/sum)*100);
  return `<div class="donut-layout">

function linkInstallment(iid,instId,planId){
  const item=db.items.find(i=>i.id===iid),inst=item&&itemSchedule(item).find(d=>d.id===instId);
  if(!item||!inst)return alert('الدفعة غير موجودة');
  if(planId&&!db.plans.some(p=>p.id===planId))return alert('الخطة المختارة غير موجودة');
  const oldId=linkedPlanId(item,inst);
  if(isCard(item)&&inst.id!==item.schedule[0]?.id){
    item.installmentFunding={...(item.installmentFunding||{}),[instId]:planId};
  }else{
    const saved=item.schedule.find(d=>d.id===instId);
    saved.fundingPlanId=planId;
  }
  const bad=fundingOverdrawn();
  if(bad){
    if(isCard(item)&&inst.id!==item.schedule[0]?.id){
      if(oldId)item.installmentFunding[instId]=oldId;else delete item.installmentFunding[instId];
    }else item.schedule.find(d=>d.id===instId).fundingPlanId=oldId;
    render();alert('لا يمكن ربط الدفعة: المبلغ المخصص يتجاوز المتاح في خطة «'+planLabel(bad)+'».');return;
  }
  save();
}
function changeInstallmentKind(iid,instId,kind){
  const item=db.items.find(i=>i.id===iid);
  if(!item||!['regular','arrears'].includes(kind))return;
  const row=item.schedule.find(d=>d.id===instId);
  if(row)row.kind=kind;
  else if(isCard(item))item.installmentKinds={...(item.installmentKinds||{}),[instId]:kind};
  save();
}

function submitPlan(pid){
  const f=document.getElementById('f'),v=Object.fromEntries(new FormData(f));
  const amount=Number(v.amount||0), carry=Number(v.carry||0);
  if(carry>0 && !v.carryFromPlanId)return alert('اختر الخطة التي سيتم ترحيل المبلغ منها');
  if(v.carryFromPlanId){
    const src=db.plans.find(x=>x.id===v.carryFromPlanId);
    if(!src || planDate(src)>=v.date)return alert('مصدر الترحيل يجب أن يكون خطة أقدم من هذه الخطة');
    if(carry>availableForCarry(v.carryFromPlanId,pid)+0.001)return alert('المبلغ المرحّل أكبر من المتبقي في الخطة المصدر');
  }
  let p=db.plans.find(x=>x.id===pid);
  const previousPlan=p?{...p}:null;
  if(p){
    const firstPayment=[...db.payments].filter(x=>x.planId===pid).sort((a,b)=>a.date.localeCompare(b.date))[0];
    if(firstPayment&&v.date>firstPayment.date)return alert('لا يمكن تأخير تاريخ توفر مبلغ الخطة إلى ما بعد سداد مسجل منها');
    const dependents=db.plans.filter(x=>x.carryFromPlanId===pid && Number(x.carry||0)>0);
    if(dependents.some(x=>v.date>=planDate(x)))return alert('هذه الخطة مصدر ترحيل لخطة أحدث؛ لا يمكن جعل تاريخها مساويًا لها أو أحدث منها');
    const outgoing=dependents.reduce((sum,x)=>sum+Number(x.carry||0),0);
    if(amount+carry-outgoing-totalPaid(p)<-0.001)return alert('المبلغ الجديد أقل من مبالغ تم سدادها أو ترحيلها بالفعل من هذه الخطة');
  }
  if(!p){p={id:id()};db.plans.push(p)}
  Object.assign(p,{
    name:v.name,
    date:v.date,
    month:v.date.slice(0,7),
    amount,
    carry,
    note:v.note||'',
    carryFromPlanId:v.carryFromPlanId||'' 
  });
  const bad=fundingOverdrawn();
  if(bad){
    if(previousPlan)Object.assign(p,previousPlan);
    else db.plans=db.plans.filter(x=>x.id!==p.id);
    alert('المبلغ المتاح لا يكفي للدفعات التي ربطتها بخطة «'+planLabel(bad)+'». عدّل الربط أو المبلغ أولًا.');return;
  }
  dismissModal();save();
}

function submitItem(iid){
  const f=document.getElementById('f'),v=Object.fromEntries(new FormData(f));
  const type=v.type==='card'?'card':'general',amount=Number(v.amount);
  const old=db.items.find(x=>x.id===iid);
  if(!Number.isFinite(amount)||amount<=0)return alert('أدخل قيمة إجمالية صحيحة للبند');
  let schedule=[];
  if(type==='card'){
    const month=v.cardFirstMonth,day=v.cardFirstDay;
    if(!validMonth(month)||!(Number(v.cardFirstMinimum)>0))return alert('أدخل شهر الدفعة الأولى والحد الأدنى');
    const date=day?month+'-'+String(Number(day)).padStart(2,'0'):'';
    if(date&&!validDate(date))return alert('تاريخ الدفعة الأولى غير صحيح');
    if(Number(v.cardFirstMinimum)>amount+0.001)return alert('الحد الأدنى الأول أكبر من مديونية البطاقة');
    schedule=[{id:old?.schedule?.[0]?.id||id(),month,date,kind:'regular',label:'الحد الأدنى الأول (ثابت)',amount:cents(v.cardFirstMinimum),fundingPlanId:v.cardFirstFundingPlanId||''}];
  }else{
    schedule=[...document.querySelectorAll('#schedule .schedule-entry')].map(r=>{
      const month=r.querySelector('.sm').value,day=r.querySelector('.sd').value;
      const date=day?month+'-'+String(Number(day)).padStart(2,'0'):'';
      const kind=r.querySelector('.sk').value;
      return {id:r.dataset.id||id(),month,date,kind,label:kind==='arrears'?'متأخرات':'قسط',amount:Number(r.querySelector('.sa').value),fundingPlanId:r.querySelector('.sp').value};
    });
  }
  if(schedule.some(d=>!validMonth(d.month)||!(d.amount>0)||!Number.isFinite(d.amount)||(d.date&&!validDate(d.date))))return alert('تحقق من الشهر واليوم ومبلغ الدفعة');
  if(schedule.reduce((s,d)=>s+d.amount,0)>amount+0.001)return alert('مجموع الدفعات أكبر من قيمة البند');
  if(schedule.some(d=>d.fundingPlanId&&!db.plans.some(p=>p.id===d.fundingPlanId)))return alert('إحدى الخطط المختارة غير موجودة');
  if(old&&amount<paidFor(old)-0.001)return alert('قيمة البند أقل من مجموع السداد الفعلي');
  if(old){
    const itemPayments=db.payments.filter(p=>p.itemId===old.id);
    if(itemPayments.length&&type!==old.type&&(type==='card'||old.type==='card'))return alert('لا يمكن تغيير نوع البند بعد تسجيل سداد عليه');
    if(isCard(old)&&itemPayments.length&&type==='card'&&(old.schedule[0]?.month!==schedule[0]?.month||old.schedule[0]?.date!==schedule[0]?.date))return alert('لا يمكن تغيير تاريخ أول استحقاق بعد سداد البطاقة');
    const paidIds=new Set(itemPayments.filter(p=>p.installmentId).map(p=>p.installmentId));
    const keptIds=new Set(schedule.map(d=>d.id));
    if(type!=='card'&&[...paidIds].some(x=>!keptIds.has(x)))return alert('لا يمكن حذف دفعة سبق السداد منها؛ احذف سجل السداد أولًا');
    for(const d of schedule){
      const paid=itemPayments.filter(p=>p.installmentId===d.id).reduce((t,p)=>t+Number(p.amount||0),0);
      if(d.amount<paid-0.001)return alert('قيمة دفعة أقل مما سُدد عليها');
    }
  }
  const record=old||{id:id()};
  const before=old?{...old}:null;
  const next={planId:old?.planId||'',name:v.name,note:v.note||'',amount:cents(amount),schedule,type,
    ...(type==='card'?{cardRate:5,installmentFunding:old?.installmentFunding||{},installmentKinds:old?.installmentKinds||{}}:{cardRate:undefined,installmentFunding:{},installmentKinds:{}})};
  Object.assign(record,next);
  if(!old)db.items.push(record);
  const bad=fundingOverdrawn();
  if(bad){
    if(old)Object.assign(record,before);else db.items=db.items.filter(i=>i!==record);
    alert('لا توجد سيولة غير مخصصة كافية في خطة «'+planLabel(bad)+'» لربط هذه الدفعات. اختر خطة أخرى أو اترك الدفعة دون ربط.');return;
  }
  dismissModal();
  active=null;tab='items';save();
  const node=document.getElementById('item-'+record.id);
  if(node&&!old)requestAnimationFrame(()=>node.scrollIntoView({behavior:'instant',block:'center'}));
}
function pay(iid,preferredPlanId='',preferredInstId=''){
  const item=db.items.find(x=>x.id===iid);
  if(!item)return alert('البند غير موجود');
  const left=remaining(item);
  if(left<=0.005)return alert('البند مسدد بالكامل');
  const balances=scheduleBalances(item);
  const scheduled=itemSchedule(item);
  const unpaid=scheduled.filter(d=>(balances[d.id]?.remaining??Number(d.amount||0))>0.005)
    .sort((a,b)=>instSortDate(a).localeCompare(instSortDate(b)));
  const first=(preferredInstId&&unpaid.find(d=>d.id===preferredInstId))||unpaid[0];
  const date=localToday();
  const funding=fundingPlansFor(date);
  if(!db.plans.some(p=>planBalance(p)>0.005))return alert('لا توجد خطة بها رصيد للسداد');
  /* لا نعتمد الخطة المرتبطة بالقسط كمصدر للسداد؛ الربط غير الخصم الفعلي.
     لا نحدد مصدرًا تلقائيًا إلا عند دخول المستخدم من داخل خطة معينة. */
  const preferred=funding.find(p=>p.id===preferredPlanId);
  const instalmentLeft=first?(balances[first.id]?.remaining??Number(first.amount||0)):left;
  const amount=cents(Math.min(left,instalmentLeft,preferred?planBalance(preferred):Infinity));
  const options=unpaid.map(d=>`<option value="${d.id}" ${first?.id===d.id?'selected':''}>${instLabel(d)} — متبقي ${money(balances[d.id]?.remaining??d.amount)}</option>`).join('');
  show(`<h2>تسجيل سداد: ${esc(item.name)}</h2>
    <p>المتبقي على البند: <b>${money(left)}</b></p>
    <form id="f" data-item-id="${iid}" onsubmit="event.preventDefault();submitPay('${iid}')">
      <label>تاريخ السداد</label>
      <input name="date" type="date" required value="${date}" onchange="refreshFundingPlans()">
      <label>الخطة التي سيُخصم منها السداد</label>
      <select class="plan-select-native" name="fundingPlanId" id="fundingPlan" onchange="refreshPaymentSourcePreview()">
        ${paymentPlanOptions(date,preferred?.id||'')}
      </select>
      <div class="note" id="paymentSourcePreview" role="status" aria-live="polite"></div>
      <label>المبلغ المدفوع</label>
      <input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required value="${amount}" oninput="refreshPaymentSourcePreview()">
      ${scheduled.length?`<label>الدفعة المرتبطة</label>
        <select name="installmentId" onchange="refreshPaymentPlanChoice()">
          ${options}<option value="">سداد عام للبند — يُوزع على أقدم دفعة غير مسددة</option>
        </select>`:'<input type="hidden" name="installmentId" value="">'}
      <p class="note">تغيير الدفعة لا يغيّر خطة الدفع التي تختارها. والخطط التي لم يحِن تاريخ توفرها تظهر غير متاحة إلى أن تغيّر تاريخ السداد. لا تسجّل سدادًا قبل حدوثه فعليًا.</p>
      <div class="actions"><button type="submit">مراجعة وتأكيد السداد</button>${button('إلغاء','dismissModal(event)')}</div>
    </form>`);
  refreshPaymentSourcePreview();
}
/* إظهار جميع الخطط، مع تعطيل التي لم يتوفر مبلغها في تاريخ السداد.
   هذا يمنع اختفاء «راتب أكتوبر» بصمت ثم اختيار «أمي ١» بالخطأ. */
function paymentPlanOptions(date,selectedId=''){
  const valid=fundingPlansFor(date);
  const activeIds=new Set(valid.map(p=>p.id));
  const upcoming=[...db.plans].filter(p=>!activeIds.has(p.id)&&planBalance(p)>0.005)
    .sort((a,b)=>planDate(a).localeCompare(planDate(b)));
  return `<option value="" disabled ${!selectedId?'selected':''}>اختر خطة الدفع بنفسك</option>`+
    valid.map(p=>`<option value="${p.id}" ${selectedId===p.id?'selected':''}>${esc(planLabel(p))}</option>`).join('')+
    upcoming.map(p=>`<option value="${p.id}" disabled>${esc(planLabel(p))}</option>`).join('');
}

function refreshPaymentSourcePreview(){
  const f=document.getElementById('f'), note=document.getElementById('paymentSourcePreview');
  if(!f||!note)return;
  const pid=f.querySelector('[name="fundingPlanId"]')?.value;
  const plan=db.plans.find(p=>p.id===pid);
  if(!plan){note.textContent='اختر الخطة التي ستدفع منها، ولن يُخصم شيء حتى تؤكد السداد.';return}
  const amount=Number(f.querySelector('[name="amount"]')?.value)||0;
  const instId=f.querySelector('[name="installmentId"]')?.value;
  const item=db.items.find(i=>i.id===f.dataset.itemId);

  const diff=linked&&linked!==pid;
  note.textContent=`سيُخصم ${money(amount)} من «${planLabel(plan)}». الرصيد الحالي ${money(planBalance(plan))}، وبعد السداد ${money(planBalance(plan)-amount)}.`+
    (diff?` القسط مربوط حاليًا بخطة «${fundingLabel(linked)}»، لكن السداد سيخرج من الخطة التي اخترتها فقط.`:'');
}

function submitPay(iid){
  const f=document.getElementById('f');
  if(!f)return;
  const v=Object.fromEntries(new FormData(f)), item=db.items.find(x=>x.id===iid);
  const plan=db.plans.find(x=>x.id===v.fundingPlanId), amount=Number(v.amount||0);
  if(!item)return alert('البند غير موجود');
  if(!Number.isFinite(amount)||amount<=0)return alert('أدخل مبلغًا صحيحًا');
  if(amount>remaining(item)+0.001)return alert('المبلغ يتجاوز المتبقي على البند');
  if(!plan)return alert('اختر خطة السداد منها بنفسك');
  if(!v.date||planDate(plan)>v.date)return alert('تاريخ توفر مبلغ الخطة يأتي بعد تاريخ السداد');
  if(v.date>localToday())return alert('لا يمكن تسجيل سداد بتاريخ مستقبلي. أضف الدفعة إلى الجدولة بدلًا من ذلك.');
  if(amount>planBalance(plan)+0.001)return alert('المبلغ يتجاوز الرصيد المتبقي في الخطة المختارة');
  if(v.installmentId){
    const inst=itemSchedule(item).find(d=>d.id===v.installmentId);
    if(!inst)return alert('الدفعة غير موجودة، أعد فتح السداد');
    if(amount>installmentRemaining(item,v.installmentId)+0.001)return alert('المبلغ أكبر من المتبقي على الدفعة المحددة');
  }
  const payment={id:id(),itemId:iid,planId:plan.id,amount:cents(amount),date:v.date,installmentId:v.installmentId||''};
  db.payments.push(payment);
  const overdrawn=fundingOverdrawn();
  db.payments.pop();
  if(overdrawn)return alert('هذا السداد سيستهلك مبلغًا مخصصًا لدفعات أخرى في خطة «'+planLabel(overdrawn)+'». عدّل ربط الدفعات أولًا.');
  /* التأكيد قبل أي عملية حفظ يذكر مصدر السداد صراحة. */
  if(!confirm(`تأكيد السداد؟\nالبند: ${item.name}\nالمبلغ: ${money(amount)}\nالخصم من خطة: ${planLabel(plan)}\nالمتبقي في هذه الخطة بعد السداد: ${money(planBalance(plan)-amount)}`))return;
  /* حماية إضافية إذا تغيّرت البيانات أثناء فتح النافذة. */
  if(amount>planBalance(plan)+0.001||amount>remaining(item)+0.001)return alert('تغيّر الرصيد، أعد فتح السداد');
  db.payments.push(payment);
  dismissModal();save();
}

function deletePlan(pid){
  if(db.plans.some(p=>p.carryFromPlanId===pid&&Number(p.carry||0)>0))return alert('لا يمكن حذف خطة تم الترحيل منها');
  if(db.payments.some(p=>p.planId===pid))return alert('لا يمكن حذف خطة سُجلت منها مدفوعات، احذف سجلات السداد أولًا');
  const linked=db.items.some(item=>itemSchedule(item).some(d=>linkedPlanId(item,d)===pid));
  if(linked)return alert('هذه الخطة مرتبطة بدفعات. فك ارتباطها من «البنود ← عرض الدفعات» قبل الحذف.');
  if(confirm('حذف هذه الخطة فقط؟ ستبقى البنود والدفعات محفوظة.')){
    db.plans=db.plans.filter(p=>p.id!==pid);
    db.items.forEach(i=>{if(i.planId===pid)i.planId=''});
    active=null;save();
  }
}
function resetApp(){
  if(!confirm('سيتم مسح جميع بيانات مبالغي نهائيًا: الخطط والبنود وسجلات السداد. هل تريد المتابعة؟'))return;
  if(!confirm('تأكيد أخير: لا يمكن التراجع بعد مسح البيانات.'))return;
  localStorage.removeItem(KEY);
  db={plans:[],items:[],payments:[]};
  localStorage.removeItem(GOALS_KEY);goals=[];
  localStorage.removeItem(STABILITY_KEY);stabilitySettings={target:0,peak:0};
  active=null;
  tab='dashboard';

}

let pendingImport=null;

  const fileName='mabaleghi-backup-'+localToday()+'.json';
  const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));
  const link=document.createElement('a');
  link.href=url;link.download=fileName;
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function importErr(message){throw new Error(message)}
function moneyField(value,label,allowZero=true){
  if(value===null||value===undefined||value==='')importErr('قيمة ناقصة: '+label);
  const n=Number(value);
  if(!Number.isFinite(n)||n<0||n>1e11||(!allowZero&&n<=0))importErr('مبلغ غير صحيح: '+label);
  if(Math.abs(n-Math.round(n*100)/100)>0.00000001)importErr('المبلغ يجب ألا يتجاوز منزلتين عشريتين: '+label);
  return Math.round(n*100)/100;
}
function validDate(s){
  if(typeof s!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s))return false;
  const d=new Date(s+'T12:00:00');
  return !isNaN(d)&&d.getFullYear()===Number(s.slice(0,4))&&d.getMonth()+1===Number(s.slice(5,7))&&d.getDate()===Number(s.slice(8,10));
}
function validMonth(s){return typeof s==='string'&&/^[0-9]{4}-(0[1-9]|1[0-2])$/.test(s)}
function fieldId(v,name){
  if(typeof v!=='string'||!(/^[a-zA-Z0-9_-]{1,100}$/.test(v)))importErr('معرّف غير صالح: '+name);
  return v;
}
function textField(s,name,max=500){
  if(s==null)return '';
  if(typeof s!=='string'||s.length>max)importErr('نص غير صالح: '+name);
  return s;
}
function normalizeDataFile(src){
  if(!src||typeof src!=='object'||Array.isArray(src))importErr('ملف البيانات غير صالح');
  if(src.format&&src.format!=='mabaleghi-data')importErr('هذا ليس ملف بيانات مبالغي');
  if(src.schemaVersion&&Number(src.schemaVersion)>2)importErr('هذا الملف من إصدار أحدث وغير مدعوم');
  const raw=src.data||src;
  if(!raw||!Array.isArray(raw.plans)||!Array.isArray(raw.items)||!Array.isArray(raw.payments))importErr('يلزم وجود الخطط والبنود والمدفوعات الثلاثة');
  if(raw.plans.length>1500||raw.items.length>10000||raw.payments.length>20000)importErr('ملف البيانات كبير أكثر من الحد المدعوم');
  const model={plans:raw.plans.map((p,i)=>{
    if(!p||typeof p!=='object')importErr('بيانات خطة غير صحيحة');
    const date=p.date||((p.month||'')+'-01');
    if(!validDate(date))importErr('تاريخ خطة غير صحيح: '+(i+1));
    const amount=moneyField(p.amount??0,'الخطة '+(i+1));
    const carry=moneyField(p.carry??0,'ترحيل الخطة '+(i+1));
    return {id:fieldId(p.id,'الخطة'),date,month:date.slice(0,7),name:textField(p.name,'اسم الخطة',200),
      amount,carry,carryFromPlanId:p.carryFromPlanId?fieldId(p.carryFromPlanId,'مصدر الترحيل'):'',note:textField(p.note,'ملاحظة الخطة')};
  }),items:raw.items.map((i,n)=>{
    if(!i||typeof i!=='object'||!Array.isArray(i.schedule))importErr('جدول بند غير صالح: '+(n+1));
    const type=i.type==='card'?'card':(i.type==null||i.type==='general'?'general':importErr('نوع البند غير مدعوم'));
    const cardRate=type==='card'?Number(i.cardRate??5):undefined;
    if(type==='card'&&cardRate!==5)importErr('نسبة البطاقة المدعومة هي 5%');
    if(type==='card'&&i.schedule.length!==1)importErr('البطاقة تحتاج دفعة أولى ثابتة واحدة فقط؛ البقية تُحسب تلقائيًا');
    const installmentFunding={};
    const installmentKinds={};
    for(const [key,value] of Object.entries(i.installmentFunding||{})){
      installmentFunding[fieldId(key,'معرف دفعة البطاقة')]=value?fieldId(value,'خطة الدفعة'):'';
    }
    for(const [key,value] of Object.entries(i.installmentKinds||{})){
      installmentKinds[fieldId(key,'معرف نوع دفعة')]=value==='arrears'?'arrears':'regular';
    }
    return {id:fieldId(i.id,'البند'),planId:i.planId?fieldId(i.planId,'خطة البند'):'',name:textField(i.name,'اسم البند',200),
      installmentFunding,installmentKinds,
      type, ...(type==='card'?{cardRate:5}:{}),
      note:textField(i.note,'ملاحظة البند'),amount:moneyField(i.amount,'البند '+(n+1),false),
      schedule:i.schedule.map((d,j)=>{
        if(!d||!validMonth(d.month))importErr('شهر الدفعة غير صحيح في البند '+(n+1));
        const date=d.date||'';
        if(date&&(!validDate(date)||date.slice(0,7)!==d.month))importErr('تاريخ استحقاق الدفعة لا يطابق شهرها في البند '+(n+1));
        return {id:fieldId(d.id,'الدفعة'),month:d.month,date,label:textField(d.label,'وصف الدفعة',120),
          kind:d.kind==='arrears'||(d.kind==null&&/متأخر/.test(String(d.label||'')))?'arrears':'regular',fundingPlanId:d.fundingPlanId?fieldId(d.fundingPlanId,'خطة الدفعة'):'',
          amount:moneyField(d.amount,'دفعة '+(j+1),false)};
      })};
  }),payments:raw.payments.map((p,i)=>{
    if(!p||!validDate(p.date))importErr('تاريخ سداد غير صالح: '+(i+1));
    return {id:fieldId(p.id,'السداد'),planId:fieldId(p.planId,'خطة السداد'),itemId:fieldId(p.itemId,'بند السداد'),
      installmentId:p.installmentId?fieldId(p.installmentId,'رقم الدفعة'):'',date:p.date,amount:moneyField(p.amount,'السداد '+(i+1),false)};
  })};
  validateImportedData(model);
  return model;
}
function validateImportedData(model){
  const planIds=new Set(),itemIds=new Set(),installmentIds=new Set(),paymentIds=new Set();
  const plans=new Map(),items=new Map(),installments=new Map();
  for(const p of model.plans){
    if(planIds.has(p.id))importErr('يوجد تكرار في معرفات الخطط');
    planIds.add(p.id);plans.set(p.id,p);
  }
  const out=new Map(),spent=new Map();
  for(const p of model.plans){
    if(p.carryFromPlanId){
      const src=plans.get(p.carryFromPlanId);
      if(!src||src.date>=p.date)importErr('ترحيل من خطة مفقودة أو تاريخها غير أقدم');
      out.set(src.id,(out.get(src.id)||0)+p.carry);
    }
  }
  for(const i of model.items){
    if(itemIds.has(i.id))importErr('يوجد تكرار في معرفات البنود');
    if(i.planId&&!plans.has(i.planId))importErr('بند يشير إلى خطة غير موجودة: '+i.name);
    itemIds.add(i.id);items.set(i.id,i);
    let scheduled=0;
    for(const d of i.schedule){
      if(installmentIds.has(d.id))importErr('تكرار معرف دفعة مجدولة');
      if(d.fundingPlanId&&!plans.has(d.fundingPlanId))importErr('دفعة تشير إلى خطة غير موجودة');
      scheduled+=d.amount;installmentIds.add(d.id);installments.set(d.id,{d,itemId:i.id});
    }
    if(scheduled>i.amount+0.005)importErr('مجموع دفعات '+i.name+' يتجاوز قيمة البند');
    for(const [instId,pid] of Object.entries(i.installmentFunding||{})){
      if(pid&&!plans.has(pid))importErr('ربط دفعة بطاقة بخطة غير موجودة');
      const prefix='card_'+i.id+'_';
      const suffix=instId.startsWith(prefix)?instId.slice(prefix.length):'';
      if(!isCard(i)||!/^[0-9]{6}$/.test(suffix)||!validMonth(suffix.slice(0,4)+'-'+suffix.slice(4)))importErr('معرف ربط دفعة بطاقة غير صحيح');
    }
    if(isCard(i) && (i.schedule.length!==1||i.schedule[0].amount>i.amount+0.005))importErr('الحد الأدنى الأول للبطاقة غير صالح');
  }
  const itemPaid=new Map(),instPaid=new Map();
  for(const p of model.payments){
    if(paymentIds.has(p.id))importErr('تكرار رقم سداد');
    paymentIds.add(p.id);
    if(!plans.has(p.planId))importErr('سداد مرتبط بخطة غير موجودة');
    if(!items.has(p.itemId))importErr('سداد مرتبط ببند غير موجود');
    if(plans.get(p.planId).date>p.date)importErr('تاريخ سداد يسبق توفر مبلغ الخطة');
    if(p.installmentId){
      let linked=installments.get(p.installmentId)?.itemId===p.itemId;
      if(!linked && isCard(items.get(p.itemId))){
        const it=items.get(p.itemId);
        const cardPattern='card_'+it.id+'_';
        const suffix=p.installmentId.slice(cardPattern.length);
        linked=p.installmentId.startsWith(cardPattern)&&/^[0-9]{6}$/.test(suffix)&&validMonth(suffix.slice(0,4)+'-'+suffix.slice(4))&&suffix>it.schedule[0].month.replace('-','');
      }
      if(!linked)importErr('السداد مرتبط بدفعة لا تخص البند');
    }
    spent.set(p.planId,(spent.get(p.planId)||0)+p.amount);
    itemPaid.set(p.itemId,(itemPaid.get(p.itemId)||0)+p.amount);
    if(p.installmentId)instPaid.set(p.installmentId,(instPaid.get(p.installmentId)||0)+p.amount);
  }
  for(const [i,amount] of itemPaid){if(amount>items.get(i).amount+0.005)importErr('سداد يتجاوز قيمة البند: '+items.get(i).name)}
  for(const [i,amount] of instPaid){
    const saved=installments.get(i);
    if(saved && amount>saved.d.amount+0.005)importErr('سداد يتجاوز قيمة الدفعة');
  }
  for(const p of model.plans){
    if(p.amount+p.carry-(out.get(p.id)||0)-(spent.get(p.id)||0)<-0.005)importErr('رصيد سالب في خطة: '+(p.name||p.date));
  }
}
async function readImportFile(input){
  const file=input.files&&input.files[0];
  input.value='';
  if(!file)return;
  if(file.size>MAX_IMPORT_BYTES){alert('حجم الملف يتجاوز 3 ميجابايت');return;}
  try{
    const payload=JSON.parse(await file.text());
    const imported=normalizeDataFile(payload);
    const importedGoals=Array.isArray(payload.goals)?validGoals(payload.goals):null;
    const importedSettings=payload.stabilitySettings?validateStabilitySettings(payload.stabilitySettings):null;
    pendingImport={model:imported,goals:importedGoals,settings:importedSettings,meta:payload.meta||{},name:file.name};
    const m=pendingImport.meta, caution=m.illustrative?'هذه خطة مقترحة بأرقام افتراضية أو غير مؤكدة. لا تعتبر أي مبلغ مستلمًا أو أي بند مسددًا حتى تسجله بنفسك.':'';
    const info=`${imported.plans.length} خطة، ${imported.items.length} بند، ${imported.payments.length} سداد مسجل${importedGoals?'، '+importedGoals.length+' هدف':''}`;
    show(`<h2>معاينة الاستيراد</h2>
      <p><b>${esc(textField(m.title||file.name,'عنوان الملف',200))}</b></p>
      <p class="note">${esc(info)}</p>
      ${caution?`<p class="note neg">${esc(caution)}</p>`:''}
      <p class="note"><b>تحديث البنود:</b> يضيف أي خطة أو بند غير موجود ويحدّث البنود المستوردة المطابقة، بما فيها مبالغ ومواعيد دفعاتها، مع إبقاء سجلات السداد والخطط الموجودة كما هي. راجع التغييرات إذا كنت عدّلت البنود يدويًا.</p>
      <p class="note"><b>دمج فقط:</b> يضيف العناصر الجديدة دون تعديل البنود الموجودة.</p>
      <p class="note"><b>استبدال:</b> يمسح بيانات مبالغي الحالية ويضع بيانات الملف مكانها. يُفضّل تصدير نسخة احتياطية أولًا.</p>
      <div class="actions">
        ${button('تحديث البنود ودمج الجديد','applyImport(\'update\')','')}
        ${button('إضافة غير الموجودة فقط','applyImport(\'merge\')')}
        ${button('استبدال كل البيانات','applyImport(\'replace\')','danger')}
        ${button('نسخة احتياطية أولًا','exportData()')}
        ${button('إلغاء','dismissModal(event)')}
      </div>`);
  }catch(err){pendingImport=null;alert('تعذر استيراد الملف: '+String(err.message||err).slice(0,210));}
}
function applyImport(mode){
  if(!pendingImport)return alert('اختر ملفًا للاستيراد أولًا');
  const source=pendingImport.model;
  const sourceGoals=pendingImport.goals;
  const sourceSettings=pendingImport.settings;
  let result,added={plans:0,items:0,payments:0},updatedItems=0;
  if(mode==='replace'){
    if(!confirm('سيتم حذف كل بيانات مبالغي الحالية واستبدالها ببيانات الملف. هل أنت متأكد؟'))return;
    if(!confirm('تأكيد أخير: هل تريد استبدال كل الخطط والبنود وسجلات السداد؟'))return;
    result=source;
  }else{
    if(mode==='update'&&!confirm('سيتم تحديث مبالغ وجداول البنود المتطابقة مع ملف الاستيراد، مع الإبقاء على خططك وسجلات السداد. هل تريد المتابعة؟'))return;
    result={plans:[...db.plans],items:[...db.items],payments:[...db.payments]};
    for(const key of ['plans','items','payments']){
      const oldIds=new Set(result[key].map(x=>x.id));
      for(const rec of source[key]){
        if(!oldIds.has(rec.id)){
          result[key].push(rec);oldIds.add(rec.id);added[key]++;
        }else if(mode==='update'&&key==='items'){
          const pos=result.items.findIndex(x=>x.id===rec.id);
          const old=result.items[pos];
          const oldSchedule=new Map(old.schedule.map(d=>[d.id,d]));
          const schedule=rec.schedule.map(d=>({...d,fundingPlanId:d.fundingPlanId||oldSchedule.get(d.id)?.fundingPlanId||''}));
          result.items[pos]={...old,name:rec.name,amount:rec.amount,note:rec.note,schedule,type:rec.type,cardRate:rec.cardRate,
            installmentFunding:{...(old.installmentFunding||{}),...(rec.installmentFunding||{})},
            installmentKinds:{...(old.installmentKinds||{}),...(rec.installmentKinds||{})}};
          updatedItems++;
        }
      }
    }
    try{validateImportedData(result)}catch(err){alert('تعذر تحديث البنود دون تعارض: '+err.message+' — لم تتغير بياناتك.');return;}
  }
  try{localStorage.setItem(KEY,JSON.stringify(result));}
  catch(err){alert('تعذر الحفظ على الجهاز؛ لم تتغير البيانات الأصلية. '+String(err.message||err).slice(0,100));return;}
  db=result;
  if(sourceGoals!==null){
    const nextGoals=mode==='replace'?sourceGoals:[...goals];
    if(mode!=='replace'){
      const existing=new Set(nextGoals.map(g=>g.id));
      sourceGoals.forEach(g=>{if(!existing.has(g.id)){nextGoals.push(g);existing.add(g.id)}});
    }
    goals=nextGoals;
    try{localStorage.setItem(GOALS_KEY,JSON.stringify(goals))}catch{alert('تم استيراد البيانات المالية، لكن لم تُحفظ الأهداف لعدم توفر مساحة تخزين كافية')}
  }
  if(sourceSettings&&mode==='replace'){stabilitySettings=sourceSettings;localStorage.setItem(STABILITY_KEY,JSON.stringify(stabilitySettings))}
  pendingImport=null;active=null;tab='dashboard';
  dismissModal();render();
  if(mode==='replace')alert('تم استبدال بيانات مبالغي بالملف المستورد بنجاح.');
  else alert(`تم الاستيراد: ${added.plans} خطة جديدة، و${added.items} بند جديد، و${updatedItems} بند محدّث، و${added.payments} سداد جديد.`);
}

if('serviceWorker'in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}
render();
</script>
