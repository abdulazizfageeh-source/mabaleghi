<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<link rel="manifest" href="manifest.webmanifest">
<title>مبالغي</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172b4d;background:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;padding-bottom:88px}
header{background:#102a43;color:white;padding:26px 18px 20px}
header h1{margin:0;font-size:25px}
header small{color:#b9cbdc}
main{max-width:720px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 3px 15px #102a430a}
.muted{color:#687b8e;font-size:13px}
.big{font-size:28px;font-weight:750;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f3f7fa;border-radius:12px;padding:13px}
.stat b{display:block;margin-top:8px;font-size:19px}
button,input,select{font:inherit}
button{border:0;background:#146c87;color:white;padding:11px 14px;border-radius:11px;cursor:pointer}
button.secondary{background:#e9f1f5;color:#194a61}
button.danger{background:#fff0f0;color:#a33333}
button.small{padding:7px 10px;font-size:13px}
input,select{width:100%;padding:11px;border:1px solid #d8e2e9;border-radius:10px;background:white;min-width:0}
label{display:block;font-size:13px;color:#536b7f;margin:10px 0 5px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f4}
.line:last-child{border:0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dce5eb;display:flex;justify-content:space-around;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:5}
.tabs button{background:transparent;color:#637b8d;flex:1}
.tabs button.active{color:#076582;font-weight:bold;background:#edf6fa}
.tag{font-size:12px;background:#e8f5f0;color:#14684b;border-radius:30px;padding:5px 8px}
.neg{color:#b42318}
.bar{height:9px;background:#e8eef3;border-radius:20px;overflow:hidden;margin-top:10px}
.bar>div{height:100%;background:#1a9a78}
.note{font-size:12px;color:#718497;line-height:1.7}
dialog{position:fixed;inset:50% auto auto 50%;transform:translate(-50%,-50%);margin:0;border:0;border-radius:18px;padding:18px;width:min(94vw,480px);max-height:85dvh;overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:#071b2ca8}
h2{font-size:19px;margin:0 0 12px}.modalClose{position:absolute;left:10px;top:10px;width:34px;height:34px;padding:0;border-radius:50%;background:#eef3f6;color:#36576a;font-size:22px;line-height:34px}
h3{font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
[hidden]{display:none!important}
.installments{border:1px solid #e0e8ee;border-radius:12px;padding:10px;margin-top:12px}
.installments summary{font-weight:650;color:#146c87;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
.installments summary::after{content:'⌄';font-size:20px}
.installments[open] summary::after{content:'⌃'}
.installments .installment-row{border-top:1px solid #edf1f4;margin-top:10px;padding-top:10px}
.installments select{margin-top:5px}
.pill{font-size:12px;border-radius:30px;padding:4px 8px;background:#edf3f7;color:#36586a}
.quickAdd{position:fixed;bottom:calc(82px + env(safe-area-inset-bottom));right:16px;z-index:4;border-radius:28px;padding:13px 19px;box-shadow:0 5px 22px #1638494d}
.item-list-pad{height:67px}
.card-emphasis{border:1px solid #acd7d7}
.full-line{margin-top:10px;padding-top:10px;border-top:1px solid #ecf0f4}
@media(max-width:360px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>مبالغي</h1><small>مبالغك وخطط السداد، ببساطة</small></header>
<main id="view"></main>
<nav class="tabs">
<button id="tab-dashboard" onclick="go('dashboard')">الداشبورد</button>
<button id="tab-plans" onclick="go('plans')">الخطط</button>
<button id="tab-items" onclick="go('items')">البنود</button>
</nav>
<dialog id="modal"></dialog>
<input id="importDataFile" type="file" accept=".json,application/json" style="display:none" onchange="readImportFile(this)">
<script>
const KEY='mabaleghi-v1';

function localToday(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function emptyDb(){return {plans:[],items:[],payments:[]}}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY))||emptyDb();
    x.plans=Array.isArray(x.plans)?x.plans:[];
    x.items=Array.isArray(x.items)?x.items:[];
    x.payments=Array.isArray(x.payments)?x.payments:[];
    x.plans.forEach(p=>{
      if(!p.date) p.date=(p.month||localToday().slice(0,7))+'-01';
      p.month=p.date.slice(0,7);
      p.carry=Number(p.carry||0);
      p.amount=Number(p.amount||0);
    });
    x.items.forEach(i=>{
      i.amount=Number(i.amount||0);
      i.schedule=Array.isArray(i.schedule)?i.schedule:[];
    });
    return x;
  }catch{return emptyDb()}
}
let db=load(),tab='dashboard',period='month',anchor=localToday().slice(0,7),active=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function id(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'mab-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function money(n){return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2})+' ر.س'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ym(s){return String(s||'').slice(0,7)}
function planDate(p){return p?.date||((p?.month||localToday().slice(0,7))+'-01')}
function planMonth(p){return planDate(p).slice(0,7)}
function monthName(s){return new Date(s+'-15T12:00:00').toLocaleDateString('ar-SA',{month:'long',year:'numeric',calendar:'gregory'})}
function dateName(s){return new Date(s+'T12:00:00').toLocaleDateString('ar-SA',{day:'numeric',month:'long',year:'numeric',calendar:'gregory'})}
function addMonths(s,n){
  let [y,m]=s.split('-').map(Number);
  let total=y*12+(m-1)+n, yy=Math.floor(total/12), mm=(total%12+12)%12+1;
  if(total<0 && total%12) yy=Math.floor(total/12);
  return `${yy}-${String(mm).padStart(2,'0')}`;
}
function paidFor(item){return db.payments.filter(p=>p.itemId===item.id).reduce((s,p)=>s+Number(p.amount||0),0)}
function totalPaid(p){return db.payments.filter(x=>x.planId===p.id).reduce((s,x)=>s+Number(x.amount||0),0)}
function outgoingCarry(planId,excludePlanId=''){
  return db.plans.filter(p=>p.id!==excludePlanId && p.carryFromPlanId===planId).reduce((s,p)=>s+Number(p.carry||0),0)
}
function planMoney(p){return Number(p.amount||0)+Number(p.carry||0)}
function planBalance(p){return planMoney(p)-outgoingCarry(p.id)-totalPaid(p)}
function availableForCarry(sourceId,targetId=''){
  const source=db.plans.find(p=>p.id===sourceId);
  if(!source)return 0;
  let v=planBalance(source);
  const target=db.plans.find(p=>p.id===targetId);
  if(target && target.carryFromPlanId===sourceId) v+=Number(target.carry||0);
  return v;
}
function remaining(i){return Math.max(0,Number(i.amount||0)-paidFor(i))}
function isCard(i){return i?.type==='card'}
function cents(v){return Math.round((Number(v)||0)*100)/100}
function cardInstallmentId(item,month){return `card_${item.id}_${month.replace('-','')}`}
function monthEndDay(month){const [year,m]=month.split('-').map(Number);return new Date(year,m,0).getDate()}
/*
  For cards the first minimum is a fixed statement amount. Later minimums are
  5% of projected outstanding balances. A projection assumes each scheduled
  minimum is paid, unless a larger actual payment has been recorded that month.
  It does not include new purchases, bank fees or interest. Actual payment
  status is never guessed: it comes only from db.payments.
*/
function itemSchedule(item){
  if(!isCard(item))return item.schedule||[];
  const first=(item.schedule||[])[0];
  if(!first||!first.month)return [];
  let balance=cents(item.amount),start=first.month;
  const byPaidMonth={};
  for(const p of db.payments.filter(p=>p.itemId===item.id)){
    const month=ym(p.date);
    byPaidMonth[month]=cents((byPaidMonth[month]||0)+Number(p.amount||0));
  }
  const months=[];
  const dueDay=first.date?Number(first.date.slice(-2)):0;
  const rate=Number(item.cardRate??5);
  for(let k=0;k<60&&balance>=0.01;k++){
    const month=addMonths(start,k);
    const due=k===0?cents(Math.min(balance,first.amount)):cents(Math.min(balance,balance*rate/100));
    if(due<0.01)break;
    const date=dueDay?`${month}-${String(Math.min(dueDay,monthEndDay(month))).padStart(2,'0')}`:'';
    months.push(k===0?{...first,amount:due,date}:{id:cardInstallmentId(item,month),month,date,label:'الحد الأدنى المتوقع — 5% من الرصيد المتبقي',kind:item.installmentKinds?.[cardInstallmentId(item,month)]||'regular',fundingPlanId:item.installmentFunding?.[cardInstallmentId(item,month)]||'',amount:due});
    const actuallyPaid=byPaidMonth[month]||0;
    balance=cents(Math.max(0,balance-Math.max(due,actuallyPaid)));
  }
  return months;
}
function cardScheduleBalances(item){
  const rows=itemSchedule(item);
  if(remaining(item)<0.005){
    return Object.fromEntries(rows.map(d=>[d.id,{paid:d.amount,remaining:0}]));
  }
  const actualForRow={};
  const validIds=new Set(rows.map(d=>d.id));
  for(const p of db.payments.filter(p=>p.itemId===item.id)){
    const rowId=p.installmentId && validIds.has(p.installmentId)
      ? p.installmentId
      : (ym(p.date)===rows[0]?.month?rows[0]?.id:cardInstallmentId(item,ym(p.date)));
    if(rowId)actualForRow[rowId]=cents((actualForRow[rowId]||0)+Number(p.amount||0));
  }
  const result={};
  for(const d of rows){
    const paid=Math.min(d.amount,actualForRow[d.id]||0);
    result[d.id]={paid,remaining:cents(Math.max(0,d.amount-paid))};
  }
  return result;
}
function installmentKind(d){
  if(d?.kind==='arrears')return 'arrears';
  if(d?.kind==='regular')return 'regular';
  return /متأخر/.test(String(d?.label||''))?'arrears':'regular';
}
function installmentKindLabel(d){return installmentKind(d)==='arrears'?'متأخرات':'قسط عادي'}
function linkedPlanId(item,inst){return String(inst?.fundingPlanId||item?.installmentFunding?.[inst?.id]||'')}
function commitmentsForPlan(planId){
  let total=0;
  for(const i of db.items){
    const balances=scheduleBalances(i);
    for(const d of itemSchedule(i)){
      if(linkedPlanId(i,d)===planId)total+=Math.max(0,Number(balances[d.id]?.remaining??d.amount??0));
    }
  }
  return cents(total);
}
function unallocatedInPlan(p){return cents(planBalance(p)-commitmentsForPlan(p.id))}
function fundingLabel(id){return id?planLabel(db.plans.find(p=>p.id===id)):'غير مرتبطة بخطة'}
let planAvailabilityCache=new Map();
function cachedUnallocated(p){
  if(!planAvailabilityCache.has(p.id))planAvailabilityCache.set(p.id,unallocatedInPlan(p));
  return planAvailabilityCache.get(p.id);
}
function fundingSelectOptions(selectedId='',emptyLabel='غير مرتبطة بخطة'){
  return `<option value="" ${!selectedId?'selected':''}>${emptyLabel}</option>`+
    [...db.plans].sort((a,b)=>planDate(a).localeCompare(planDate(b))).map(p=>`<option value="${p.id}" ${selectedId===p.id?'selected':''}>${esc(planLabel(p))} · ${dateName(planDate(p))} · غير مخصص ${money(cachedUnallocated(p))}</option>`).join('');
}
function fundingOverdrawn(){return db.plans.find(p=>commitmentsForPlan(p.id)>planBalance(p)+0.005)}
function instSortDate(d){return d.date||d.month+'-31'}
function instLabel(d){return (d.label?esc(d.label)+' — ':'')+(d.date?dateName(d.date):monthName(d.month))}
function scheduleBalances(item){
  if(isCard(item))return cardScheduleBalances(item);
  const explicit={};
  let general=0;
  db.payments.filter(p=>p.itemId===item.id).forEach(p=>{
    if(p.installmentId) explicit[p.installmentId]=(explicit[p.installmentId]||0)+Number(p.amount||0);
    else general+=Number(p.amount||0);
  });
  const rows=itemSchedule(item).map((d,idx)=>({...d,_idx:idx})).sort((a,b)=>instSortDate(a).localeCompare(instSortDate(b))||a._idx-b._idx);
  const out={};
  rows.forEach(d=>{
    const linked=Math.min(Number(d.amount||0),explicit[d.id]||0);
    let left=Math.max(0,Number(d.amount||0)-linked);
    const fromGeneral=Math.min(general,left);
    general-=fromGeneral;
    left-=fromGeneral;
    out[d.id]={paid:linked+fromGeneral,remaining:left};
  });
  return out;
}
function installmentRemaining(item,instId){return scheduleBalances(item)[instId]?.remaining??0}
function due(m){
  return db.items.reduce((s,i)=>{
    const bal=scheduleBalances(i);
    return s+itemSchedule(i).filter(d=>d.month===m).reduce((a,d)=>a+(bal[d.id]?.remaining??Number(d.amount||0)),0);
  },0);
}
function planLabel(p){return p?(p.name||('خطة '+dateName(planDate(p)))):''}
function fundingPlansFor(date){
  return [...db.plans]
    .filter(p=>planDate(p)<=date && planBalance(p)>0.0001)
    .sort((a,b)=>planDate(b).localeCompare(planDate(a)));
}
function scheduledEntriesForMonth(month,excludeOriginPlanId='',notAfterDate=''){
  const rows=[];
  db.items.forEach(item=>{
    const originPlan=db.plans.find(p=>p.id===item.planId);
    const bal=scheduleBalances(item);
    itemSchedule(item).forEach(inst=>{
      const left=bal[inst.id]?.remaining??Number(inst.amount||0);
      if(inst.month===month&&left>0.0001){
        if(excludeOriginPlanId&&item.planId===excludeOriginPlanId)return;
        if(notAfterDate&&originPlan&&planDate(originPlan)>notAfterDate)return;
        rows.push({item,inst,remaining:left,originPlan});
      }
    });
  });
  return rows.sort((a,b)=>instSortDate(a.inst).localeCompare(instSortDate(b.inst)));
}
function scheduledEntriesForPlan(planId){
  const result=[];
  for(const item of db.items){
    const bal=scheduleBalances(item);
    for(const inst of itemSchedule(item)){
      if(linkedPlanId(item,inst)!==planId)continue;
      const left=bal[inst.id]?.remaining??inst.amount;
      result.push({item,inst,remaining:left});
    }
  }
  return result.sort((a,b)=>instSortDate(a.inst).localeCompare(instSortDate(b.inst)));
}
function button(label,fn,cl='secondary'){const noValidate=(label==='إلغاء'||label==='إغلاق')?' formnovalidate':'';return `<button type="button"${noValidate} class="${cl}" onclick="${fn}">${label}</button>`}
const expandedInstallments=new Set();
function toggleInstallments(iid,node){
  if(node.open===expandedInstallments.has(iid))return;
  if(node.open)expandedInstallments.add(iid);
  else expandedInstallments.delete(iid);
  render();
}
function go(t){tab=t;active=null;render()}
function render(){
  planAvailabilityCache=new Map();
  const container=document.getElementById('view');
  container.querySelectorAll('details.installments').forEach(node=>{
    const iid=node.closest('[id^="item-"]')?.id.slice(5);
    if(iid){if(node.open)expandedInstallments.add(iid);else expandedInstallments.delete(iid)}
  });
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+tab));
  container.innerHTML=tab==='dashboard'?dashboard():tab==='plans'?plans():items();
}

function dashboard(){
  const months=period==='month'?1:period==='quarter'?3:period==='half'?6:12;
  const list=Array.from({length:months},(_,i)=>addMonths(anchor,i));
  const ps=db.plans.filter(p=>list.includes(planMonth(p)));
  const planIds=new Set(ps.map(p=>p.id));
  const entered=ps.reduce((sum,p)=>sum+Number(p.amount||0),0);
  const carryIn=ps.reduce((sum,p)=>sum+Number(p.carry||0),0);
  const carryOut=ps.reduce((sum,p)=>sum+outgoingCarry(p.id),0);
  const paidFromPlans=db.payments.filter(p=>planIds.has(p.planId)).reduce((sum,p)=>sum+Number(p.amount||0),0);
  const scheduled=list.reduce((sum,m)=>sum+due(m),0);
  const balance=ps.reduce((sum,p)=>sum+planBalance(p),0);
  const usableBase=Math.max(0,entered+carryIn-carryOut);
  const committed=ps.reduce((sum,p)=>sum+commitmentsForPlan(p.id),0);
  return `<div class="card">
    <h2>لوحة التحكم</h2>
    <label>عرض الفترة</label>
    <select onchange="period=this.value;render()">
      <option value="month" ${period==='month'?'selected':''}>شهري</option>
      <option value="quarter" ${period==='quarter'?'selected':''}>ربع سنوي</option>
      <option value="half" ${period==='half'?'selected':''}>نصف سنوي</option>
      <option value="year" ${period==='year'?'selected':''}>سنوي</option>
    </select>
    <label>بداية الفترة</label>
    <input type="month" value="${anchor}" onchange="anchor=this.value;render()">
  </div>
  <div class="card">
    <div class="muted">المتبقي الحالي من مبالغ خطط الفترة</div>
    <div class="big ${balance<0?'neg':''}">${money(balance)}</div>
    <div class="bar"><div style="width:${usableBase?Math.min(100,Math.max(0,balance/usableBase*100)):0}%"></div></div>
    <p class="note">المتبقي النقدي بعد السداد الفعلي والترحيل. ربط دفعة بخطة يحجزها ضمن المخصص فقط ولا يخصمها نقديًا إلا عند السداد.</p>
  </div>
  <div class="grid">
    <div class="stat"><span class="muted">مبالغ جديدة</span><b>${money(entered)}</b></div>
    <div class="stat"><span class="muted">ترحيل وارد</span><b>${money(carryIn)}</b></div>
    <div class="stat"><span class="muted">ترحيل صادر</span><b>${money(carryOut)}</b></div>
    <div class="stat"><span class="muted">مسدد من هذه الخطط</span><b>${money(paidFromPlans)}</b></div>
    <div class="stat"><span class="muted">دفعات مجدولة في الفترة</span><b>${money(scheduled)}</b></div>
    <div class="stat"><span class="muted">مخصص لدفعات من هذه الخطط</span><b>${money(committed)}</b></div>
    <div class="stat"><span class="muted">متاح غير مخصص</span><b>${money(balance-committed)}</b></div>
    <div class="stat"><span class="muted">عدد الخطط</span><b>${ps.length}</b></div>
  </div>
  <div class="card" style="margin-top:13px">
    <h3>الأشهر في الفترة</h3>
    ${list.map(m=>`<div class="line"><span>${monthName(m)}</span><span>${money(due(m))} <small class="muted">مجدول غير مسدد</small></span></div>`).join('')}
  </div>
  <div class="card">
    <h3>ملفات البيانات</h3>
    <p class="note">استيراد خطط وبنود ودفعات من ملف JSON محفوظ على الآيفون، أو تصدير نسخة احتياطية من جميع بيانات مبالغي. لا تُرسل البيانات إلى الإنترنت.</p>
    <div class="actions">
      ${button('استيراد ملف بيانات',"document.getElementById('importDataFile').click()",'')}
      ${button('تصدير نسخة احتياطية','exportData()')}
    </div>
  </div>
  <div class="card">
    <h3>إعادة ضبط التطبيق</h3>
    <p class="note">يمسح جميع خطط وبنود وسجلات سداد تطبيق مبالغي فقط، ويعيده كأنه جديد.</p>
    <div class="actions">${button('مسح جميع بيانات مبالغي','resetApp()','danger')}</div>
  </div>`;
}

function plans(){
  const sorted=[...db.plans].sort((a,b)=>planDate(b).localeCompare(planDate(a)));
  return `<div class="card">
    <div class="line"><h2>الخطط</h2>${button('+ خطة جديدة','editPlan()','')}</div>
    <p class="note">أنشئ المبلغ وتاريخه أولًا، ثم اربط أي دفعة من أي بند بهذه الخطة. الترحيل اختياري.</p>
  </div>
  ${sorted.map(p=>{
    const committed=commitmentsForPlan(p.id),current=planBalance(p);
    const linked=scheduledEntriesForPlan(p.id);
    return `<div class="card">
      <div class="line"><div><b>${esc(planLabel(p))}</b><div class="muted">تاريخ توفر المبلغ: ${dateName(planDate(p))}</div></div>
        <span class="tag">${money(current)}</span></div>
      <div class="grid">
        <div class="stat"><span class="muted">المتاح قبل السداد</span><b>${money(planMoney(p)-outgoingCarry(p.id))}</b></div>
        <div class="stat"><span class="muted">المسدد من الخطة</span><b>${money(totalPaid(p))}</b></div>
        <div class="stat"><span class="muted">مخصص لدفعات</span><b>${money(committed)}</b></div>
        <div class="stat"><span class="muted">غير مخصص</span><b class="${current-committed<-0.005?'neg':''}">${money(current-committed)}</b></div>
      </div>
      ${p.note?`<p class="note">${esc(p.note)}</p>`:''}

function linkInstallment(iid,instId,planId){
  const item=db.items.find(i=>i.id===iid),inst=item&&itemSchedule(item).find(d=>d.id===instId);
  if(!item||!inst)return alert('الدفعة غير موجودة');
  if(planId&&!db.plans.some(p=>p.id===planId))return alert('الخطة المختارة غير موجودة');
  const oldId=linkedPlanId(item,inst);
  if(isCard(item)&&inst.id!==item.schedule[0]?.id){
    item.installmentFunding={...(item.installmentFunding||{}),[instId]:planId};
  }else{
    const saved=item.schedule.find(d=>d.id===instId);
    saved.fundingPlanId=planId;
  }
  const bad=fundingOverdrawn();
  if(bad){
    if(isCard(item)&&inst.id!==item.schedule[0]?.id){
      if(oldId)item.installmentFunding[instId]=oldId;else delete item.installmentFunding[instId];
    }else item.schedule.find(d=>d.id===instId).fundingPlanId=oldId;
    render();alert('لا يمكن ربط الدفعة: المبلغ المخصص يتجاوز المتاح في خطة «'+planLabel(bad)+'».');return;
  }
  save();
}
function changeInstallmentKind(iid,instId,kind){
  const item=db.items.find(i=>i.id===iid);
  if(!item||!['regular','arrears'].includes(kind))return;
  const row=item.schedule.find(d=>d.id===instId);
  if(row)row.kind=kind;
  else if(isCard(item))item.installmentKinds={...(item.installmentKinds||{}),[instId]:kind};
  save();
}

function submitPlan(pid){
  const f=document.getElementById('f'),v=Object.fromEntries(new FormData(f));
  const amount=Number(v.amount||0), carry=Number(v.carry||0);
  if(carry>0 && !v.carryFromPlanId)return alert('اختر الخطة التي سيتم ترحيل المبلغ منها');
  if(v.carryFromPlanId){
    const src=db.plans.find(x=>x.id===v.carryFromPlanId);
    if(!src || planDate(src)>=v.date)return alert('مصدر الترحيل يجب أن يكون خطة أقدم من هذه الخطة');
    if(carry>availableForCarry(v.carryFromPlanId,pid)+0.001)return alert('المبلغ المرحّل أكبر من المتبقي في الخطة المصدر');
  }
  let p=db.plans.find(x=>x.id===pid);
  const previousPlan=p?{...p}:null;
  if(p){
    const firstPayment=[...db.payments].filter(x=>x.planId===pid).sort((a,b)=>a.date.localeCompare(b.date))[0];
    if(firstPayment&&v.date>firstPayment.date)return alert('لا يمكن تأخير تاريخ توفر مبلغ الخطة إلى ما بعد سداد مسجل منها');
    const dependents=db.plans.filter(x=>x.carryFromPlanId===pid && Number(x.carry||0)>0);
    if(dependents.some(x=>v.date>=planDate(x)))return alert('هذه الخطة مصدر ترحيل لخطة أحدث؛ لا يمكن جعل تاريخها مساويًا لها أو أحدث منها');
    const outgoing=dependents.reduce((sum,x)=>sum+Number(x.carry||0),0);
    if(amount+carry-outgoing-totalPaid(p)<-0.001)return alert('المبلغ الجديد أقل من مبالغ تم سدادها أو ترحيلها بالفعل من هذه الخطة');
  }
  if(!p){p={id:id()};db.plans.push(p)}
  Object.assign(p,{
    name:v.name,
    date:v.date,
    month:v.date.slice(0,7),
    amount,
    carry,
    note:v.note||'',
    carryFromPlanId:v.carryFromPlanId||'' 
  });
  const bad=fundingOverdrawn();
  if(bad){
    if(previousPlan)Object.assign(p,previousPlan);
    else db.plans=db.plans.filter(x=>x.id!==p.id);
    alert('المبلغ المتاح لا يكفي للدفعات التي ربطتها بخطة «'+planLabel(bad)+'». عدّل الربط أو المبلغ أولًا.');return;
  }
  dismissModal();save();
}

function submitItem(iid){
  const f=document.getElementById('f'),v=Object.fromEntries(new FormData(f));
  const type=v.type==='card'?'card':'general',amount=Number(v.amount);
  const old=db.items.find(x=>x.id===iid);
  if(!Number.isFinite(amount)||amount<=0)return alert('أدخل قيمة إجمالية صحيحة للبند');
  let schedule=[];
  if(type==='card'){
    const month=v.cardFirstMonth,day=v.cardFirstDay;
    if(!validMonth(month)||!(Number(v.cardFirstMinimum)>0))return alert('أدخل شهر الدفعة الأولى والحد الأدنى');
    const date=day?month+'-'+String(Number(day)).padStart(2,'0'):'';
    if(date&&!validDate(date))return alert('تاريخ الدفعة الأولى غير صحيح');
    if(Number(v.cardFirstMinimum)>amount+0.001)return alert('الحد الأدنى الأول أكبر من مديونية البطاقة');
    schedule=[{id:old?.schedule?.[0]?.id||id(),month,date,kind:'regular',label:'الحد الأدنى الأول (ثابت)',amount:cents(v.cardFirstMinimum),fundingPlanId:v.cardFirstFundingPlanId||''}];
  }else{
    schedule=[...document.querySelectorAll('#schedule .schedule-entry')].map(r=>{
      const month=r.querySelector('.sm').value,day=r.querySelector('.sd').value;
      const date=day?month+'-'+String(Number(day)).padStart(2,'0'):'';
      const kind=r.querySelector('.sk').value;
      return {id:r.dataset.id||id(),month,date,kind,label:kind==='arrears'?'متأخرات':'قسط',amount:Number(r.querySelector('.sa').value),fundingPlanId:r.querySelector('.sp').value};
    });
  }
  if(schedule.some(d=>!validMonth(d.month)||!(d.amount>0)||!Number.isFinite(d.amount)||(d.date&&!validDate(d.date))))return alert('تحقق من الشهر واليوم ومبلغ الدفعة');
  if(schedule.reduce((s,d)=>s+d.amount,0)>amount+0.001)return alert('مجموع الدفعات أكبر من قيمة البند');
  if(schedule.some(d=>d.fundingPlanId&&!db.plans.some(p=>p.id===d.fundingPlanId)))return alert('إحدى الخطط المختارة غير موجودة');
  if(old&&amount<paidFor(old)-0.001)return alert('قيمة البند أقل من مجموع السداد الفعلي');
  if(old){
    const itemPayments=db.payments.filter(p=>p.itemId===old.id);
    if(itemPayments.length&&type!==old.type&&(type==='card'||old.type==='card'))return alert('لا يمكن تغيير نوع البند بعد تسجيل سداد عليه');
    if(isCard(old)&&itemPayments.length&&type==='card'&&(old.schedule[0]?.month!==schedule[0]?.month||old.schedule[0]?.date!==schedule[0]?.date))return alert('لا يمكن تغيير تاريخ أول استحقاق بعد سداد البطاقة');
    const paidIds=new Set(itemPayments.filter(p=>p.installmentId).map(p=>p.installmentId));
    const keptIds=new Set(schedule.map(d=>d.id));
    if(type!=='card'&&[...paidIds].some(x=>!keptIds.has(x)))return alert('لا يمكن حذف دفعة سبق السداد منها؛ احذف سجل السداد أولًا');
    for(const d of schedule){
      const paid=itemPayments.filter(p=>p.installmentId===d.id).reduce((t,p)=>t+Number(p.amount||0),0);
      if(d.amount<paid-0.001)return alert('قيمة دفعة أقل مما سُدد عليها');
    }
  }
  const record=old||{id:id()};
  const before=old?{...old}:null;
  const next={planId:old?.planId||'',name:v.name,note:v.note||'',amount:cents(amount),schedule,type,
    ...(type==='card'?{cardRate:5,installmentFunding:old?.installmentFunding||{},installmentKinds:old?.installmentKinds||{}}:{cardRate:undefined,installmentFunding:{},installmentKinds:{}})};
  Object.assign(record,next);
  if(!old)db.items.push(record);
  const bad=fundingOverdrawn();
  if(bad){
    if(old)Object.assign(record,before);else db.items=db.items.filter(i=>i!==record);
    alert('لا توجد سيولة غير مخصصة كافية في خطة «'+planLabel(bad)+'» لربط هذه الدفعات. اختر خطة أخرى أو اترك الدفعة دون ربط.');return;
  }
  dismissModal();
  active=null;tab='items';save();
  const node=document.getElementById('item-'+record.id);
  if(node&&!old)requestAnimationFrame(()=>node.scrollIntoView({behavior:'instant',block:'center'}));
}
function pay(iid,preferredPlanId='',preferredInstId=''){
  const i=db.items.find(x=>x.id===iid);
  if(!i)return alert('البند غير موجود');
  const left=remaining(i);
  if(!left)return alert('البند مسدد بالكامل');
  const bal=scheduleBalances(i);
  const computedSchedule=itemSchedule(i);
  const unpaid=computedSchedule.filter(d=>(bal[d.id]?.remaining??Number(d.amount||0))>0).sort((a,b)=>instSortDate(a).localeCompare(instSortDate(b)));
  const preferredInst=preferredInstId&&unpaid.find(d=>d.id===preferredInstId);
  const first=preferredInst||unpaid[0];
  const paymentDate=localToday();
  const funding=fundingPlansFor(paymentDate);
  if(!funding.length)return alert('لا توجد خطة متاحة بتاريخ اليوم وبها رصيد للسداد');
  const linked=first?linkedPlanId(i,first):'';
  const preferred=funding.find(p=>p.id===(preferredPlanId||linked))||funding.find(p=>p.id===linked)||funding.find(p=>p.id===i.planId)||funding[0];
  const instLeft=first?(bal[first.id]?.remaining??Number(first.amount||0)):left;
  const defaultAmount=Math.min(left,planBalance(preferred),instLeft);
  const options=unpaid.map(d=>`<option value="${d.id}" ${first?.id===d.id?'selected':''}>${instLabel(d)} — متبقي ${money(bal[d.id]?.remaining??d.amount)}</option>`).join('');
  show(`<h2>سداد: ${esc(i.name)}</h2>
    <p>المتبقي على البند: <b>${money(left)}</b></p>
    <form id="f" data-item-id="${iid}" onsubmit="event.preventDefault();submitPay('${iid}')">
      <label>تاريخ السداد</label>
      <input name="date" type="date" required value="${paymentDate}" onchange="refreshFundingPlans('${preferred.id}')">
      <label>السداد من أي خطة؟</label>
      <select name="fundingPlanId" id="fundingPlan" required>
        ${funding.map(p=>`<option value="${p.id}" ${p.id===preferred.id?'selected':''}>${esc(planLabel(p))} — متاح ${money(planBalance(p))}</option>`).join('')}
      </select>
      <label>المبلغ المدفوع</label>
      <input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required value="${defaultAmount}">
      ${computedSchedule.length?`<label>الدفعة المرتبطة</label>
      <select name="installmentId" onchange="refreshPaymentPlanChoice()">
        ${options}
        <option value="">سداد عام للبند — يُوزع على أقدم دفعة غير مسددة</option>
      </select>`:'<input type="hidden" name="installmentId" value="">'}
      <p class="note">يمكن سداد بند قديم من خطة أحدث طالما أن مبلغ الخطة متوفر في تاريخ السداد.</p>
      <div class="actions"><button type="submit">تأكيد السداد</button>${button('إلغاء','dismissModal(event)')}</div>
    </form>`);
}
function refreshPaymentPlanChoice(){

  if(pid&&[...plan.options].some(o=>o.value===pid))plan.value=pid;
}
function refreshFundingPlans(preferredId=''){

  if(!f||!sel)return;

  const funding=fundingPlansFor(date);
  sel.innerHTML=funding.map(p=>`<option value="${p.id}" ${p.id===current?'selected':''}>${esc(planLabel(p))} — متاح ${money(planBalance(p))}</option>`).join('');
  if(!funding.length)sel.innerHTML='<option value="">لا توجد خطة متاحة بهذا التاريخ</option>';

function submitPay(iid){
  const v=Object.fromEntries(new FormData(document.getElementById('f'))), i=db.items.find(x=>x.id===iid);
  const p=db.plans.find(x=>x.id===v.fundingPlanId), amount=Number(v.amount||0);
  if(!i)return alert('البند غير موجود');
  if(amount<=0)return alert('أدخل مبلغًا صحيحًا');
  if(amount>remaining(i)+0.001)return alert('المبلغ يتجاوز المتبقي على البند');
  if(!p)return alert('اختر خطة للسداد منها');
  if(planDate(p)>v.date)return alert('تاريخ توفر مبلغ الخطة يأتي بعد تاريخ السداد');
  if(amount>planBalance(p)+0.001)return alert('المبلغ يتجاوز الرصيد المتبقي في الخطة المختارة');
  if(v.installmentId){
    const left=installmentRemaining(i,v.installmentId);
    if(amount>left+0.001)return alert('المبلغ أكبر من المتبقي على الدفعة المحددة');
  }
  const payment={id:id(),itemId:iid,planId:p.id,amount:cents(amount),date:v.date,installmentId:v.installmentId||''};
  db.payments.push(payment);
  const bad=fundingOverdrawn();
  if(bad){
    db.payments=db.payments.filter(x=>x.id!==payment.id);
    alert('هذا السداد سيستهلك مبلغًا مخصصًا لدفعات أخرى في خطة «'+planLabel(bad)+'». عدّل ربط الدفعات أولًا.');return;
  }
  dismissModal();save();
}

// File import/export is intentionally offline and never auto-imports or auto-overwrites data.
let pendingImport=null;
const MAX_IMPORT_BYTES=3*1024*1024;
function exportData(){
  const payload={format:'mabaleghi-data',schemaVersion:2,exportedAt:new Date().toISOString(),data:db};
  const fileName='mabaleghi-backup-'+localToday()+'.json';
  const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}));
  const link=document.createElement('a');
  link.href=url;link.download=fileName;
  document.body.appendChild(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function importErr(message){throw new Error(message)}
function moneyField(value,label,allowZero=true){
  if(value===null||value===undefined||value==='')importErr('قيمة ناقصة: '+label);
  const n=Number(value);
  if(!Number.isFinite(n)||n<0||n>1e11||(!allowZero&&n<=0))importErr('مبلغ غير صحيح: '+label);
  if(Math.abs(n-Math.round(n*100)/100)>0.00000001)importErr('المبلغ يجب ألا يتجاوز منزلتين عشريتين: '+label);
  return Math.round(n*100)/100;
}
function validDate(s){
  if(typeof s!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s))return false;
  const d=new Date(s+'T12:00:00');
  return !isNaN(d)&&d.getFullYear()===Number(s.slice(0,4))&&d.getMonth()+1===Number(s.slice(5,7))&&d.getDate()===Number(s.slice(8,10));
}
function validMonth(s){return typeof s==='string'&&/^[0-9]{4}-(0[1-9]|1[0-2])$/.test(s)}
function fieldId(v,name){
  if(typeof v!=='string'||!(/^[a-zA-Z0-9_-]{1,100}$/.test(v)))importErr('معرّف غير صالح: '+name);
  return v;
}
function textField(s,name,max=500){
  if(s==null)return '';
  if(typeof s!=='string'||s.length>max)importErr('نص غير صالح: '+name);
  return s;
}
function normalizeDataFile(src){
  if(!src||typeof src!=='object'||Array.isArray(src))importErr('ملف البيانات غير صالح');
  if(src.format&&src.format!=='mabaleghi-data')importErr('هذا ليس ملف بيانات مبالغي');
  if(src.schemaVersion&&Number(src.schemaVersion)>2)importErr('هذا الملف من إصدار أحدث وغير مدعوم');
  const raw=src.data||src;
  if(!raw||!Array.isArray(raw.plans)||!Array.isArray(raw.items)||!Array.isArray(raw.payments))importErr('يلزم وجود الخطط والبنود والمدفوعات الثلاثة');
  if(raw.plans.length>1500||raw.items.length>10000||raw.payments.length>20000)importErr('ملف البيانات كبير أكثر من الحد المدعوم');
  const model={plans:raw.plans.map((p,i)=>{
    if(!p||typeof p!=='object')importErr('بيانات خطة غير صحيحة');
    const date=p.date||((p.month||'')+'-01');
    if(!validDate(date))importErr('تاريخ خطة غير صحيح: '+(i+1));
    const amount=moneyField(p.amount??0,'الخطة '+(i+1));
    const carry=moneyField(p.carry??0,'ترحيل الخطة '+(i+1));
    return {id:fieldId(p.id,'الخطة'),date,month:date.slice(0,7),name:textField(p.name,'اسم الخطة',200),
      amount,carry,carryFromPlanId:p.carryFromPlanId?fieldId(p.carryFromPlanId,'مصدر الترحيل'):'',note:textField(p.note,'ملاحظة الخطة')};
  }),items:raw.items.map((i,n)=>{
    if(!i||typeof i!=='object'||!Array.isArray(i.schedule))importErr('جدول بند غير صالح: '+(n+1));
    const type=i.type==='card'?'card':(i.type==null||i.type==='general'?'general':importErr('نوع البند غير مدعوم'));
    const cardRate=type==='card'?Number(i.cardRate??5):undefined;
    if(type==='card'&&cardRate!==5)importErr('نسبة البطاقة المدعومة هي 5%');
    if(type==='card'&&i.schedule.length!==1)importErr('البطاقة تحتاج دفعة أولى ثابتة واحدة فقط؛ البقية تُحسب تلقائيًا');
    const installmentFunding={};
    const installmentKinds={};
    for(const [key,value] of Object.entries(i.installmentFunding||{})){
      installmentFunding[fieldId(key,'معرف دفعة البطاقة')]=value?fieldId(value,'خطة الدفعة'):'';
    }
    for(const [key,value] of Object.entries(i.installmentKinds||{})){
      installmentKinds[fieldId(key,'معرف نوع دفعة')]=value==='arrears'?'arrears':'regular';
    }
    return {id:fieldId(i.id,'البند'),planId:i.planId?fieldId(i.planId,'خطة البند'):'',name:textField(i.name,'اسم البند',200),
      installmentFunding,installmentKinds,
      type, ...(type==='card'?{cardRate:5}:{}),
      note:textField(i.note,'ملاحظة البند'),amount:moneyField(i.amount,'البند '+(n+1),false),
      schedule:i.schedule.map((d,j)=>{
        if(!d||!validMonth(d.month))importErr('شهر الدفعة غير صحيح في البند '+(n+1));
        const date=d.date||'';
        if(date&&(!validDate(date)||date.slice(0,7)!==d.month))importErr('تاريخ استحقاق الدفعة لا يطابق شهرها في البند '+(n+1));
        return {id:fieldId(d.id,'الدفعة'),month:d.month,date,label:textField(d.label,'وصف الدفعة',120),
          kind:d.kind==='arrears'||(d.kind==null&&/متأخر/.test(String(d.label||'')))?'arrears':'regular',fundingPlanId:d.fundingPlanId?fieldId(d.fundingPlanId,'خطة الدفعة'):'',
          amount:moneyField(d.amount,'دفعة '+(j+1),false)};
      })};
  }),payments:raw.payments.map((p,i)=>{
    if(!p||!validDate(p.date))importErr('تاريخ سداد غير صالح: '+(i+1));
    return {id:fieldId(p.id,'السداد'),planId:fieldId(p.planId,'خطة السداد'),itemId:fieldId(p.itemId,'بند السداد'),
      installmentId:p.installmentId?fieldId(p.installmentId,'رقم الدفعة'):'',date:p.date,amount:moneyField(p.amount,'السداد '+(i+1),false)};
  })};
  validateImportedData(model);
  return model;
}
function validateImportedData(model){
  const planIds=new Set(),itemIds=new Set(),installmentIds=new Set(),paymentIds=new Set();
  const plans=new Map(),items=new Map(),installments=new Map();
  for(const p of model.plans){
    if(planIds.has(p.id))importErr('يوجد تكرار في معرفات الخطط');
    planIds.add(p.id);plans.set(p.id,p);
  }
  const out=new Map(),spent=new Map();
  for(const p of model.plans){
    if(p.carryFromPlanId){
      const src=plans.get(p.carryFromPlanId);
      if(!src||src.date>=p.date)importErr('ترحيل من خطة مفقودة أو تاريخها غير أقدم');
      out.set(src.id,(out.get(src.id)||0)+p.carry);
    }
  }
  for(const i of model.items){
    if(itemIds.has(i.id))importErr('يوجد تكرار في معرفات البنود');
    if(i.planId&&!plans.has(i.planId))importErr('بند يشير إلى خطة غير موجودة: '+i.name);
    itemIds.add(i.id);items.set(i.id,i);
    let scheduled=0;
    for(const d of i.schedule){
      if(installmentIds.has(d.id))importErr('تكرار معرف دفعة مجدولة');
      if(d.fundingPlanId&&!plans.has(d.fundingPlanId))importErr('دفعة تشير إلى خطة غير موجودة');
      scheduled+=d.amount;installmentIds.add(d.id);installments.set(d.id,{d,itemId:i.id});
    }
    if(scheduled>i.amount+0.005)importErr('مجموع دفعات '+i.name+' يتجاوز قيمة البند');
    for(const [instId,pid] of Object.entries(i.installmentFunding||{})){
      if(pid&&!plans.has(pid))importErr('ربط دفعة بطاقة بخطة غير موجودة');
      const prefix='card_'+i.id+'_';
      const suffix=instId.startsWith(prefix)?instId.slice(prefix.length):'';
      if(!isCard(i)||!/^[0-9]{6}$/.test(suffix)||!validMonth(suffix.slice(0,4)+'-'+suffix.slice(4)))importErr('معرف ربط دفعة بطاقة غير صحيح');
    }
    if(isCard(i) && (i.schedule.length!==1||i.schedule[0].amount>i.amount+0.005))importErr('الحد الأدنى الأول للبطاقة غير صالح');
  }
  const itemPaid=new Map(),instPaid=new Map();
  for(const p of model.payments){
    if(paymentIds.has(p.id))importErr('تكرار رقم سداد');
    paymentIds.add(p.id);
    if(!plans.has(p.planId))importErr('سداد مرتبط بخطة غير موجودة');
    if(!items.has(p.itemId))importErr('سداد مرتبط ببند غير موجود');
    if(plans.get(p.planId).date>p.date)importErr('تاريخ سداد يسبق توفر مبلغ الخطة');
    if(p.installmentId){
      let linked=installments.get(p.installmentId)?.itemId===p.itemId;
      if(!linked && isCard(items.get(p.itemId))){
        const it=items.get(p.itemId);
        const cardPattern='card_'+it.id+'_';
        const suffix=p.installmentId.slice(cardPattern.length);
        linked=p.installmentId.startsWith(cardPattern)&&/^[0-9]{6}$/.test(suffix)&&validMonth(suffix.slice(0,4)+'-'+suffix.slice(4))&&suffix>it.schedule[0].month.replace('-','');
      }
      if(!linked)importErr('السداد مرتبط بدفعة لا تخص البند');
    }
    spent.set(p.planId,(spent.get(p.planId)||0)+p.amount);
    itemPaid.set(p.itemId,(itemPaid.get(p.itemId)||0)+p.amount);
    if(p.installmentId)instPaid.set(p.installmentId,(instPaid.get(p.installmentId)||0)+p.amount);
  }
  for(const [i,amount] of itemPaid){if(amount>items.get(i).amount+0.005)importErr('سداد يتجاوز قيمة البند: '+items.get(i).name)}
  for(const [i,amount] of instPaid){
    const saved=installments.get(i);
    if(saved && amount>saved.d.amount+0.005)importErr('سداد يتجاوز قيمة الدفعة');
  }
  for(const p of model.plans){
    if(p.amount+p.carry-(out.get(p.id)||0)-(spent.get(p.id)||0)<-0.005)importErr('رصيد سالب في خطة: '+(p.name||p.date));
  }
}
async function readImportFile(input){
  const file=input.files&&input.files[0];
  input.value='';
  if(!file)return;
  if(file.size>MAX_IMPORT_BYTES){alert('حجم الملف يتجاوز 3 ميجابايت');return;}
  try{
    const payload=JSON.parse(await file.text());
    const imported=normalizeDataFile(payload);
    pendingImport={model:imported,meta:payload.meta||{},name:file.name};
    const m=pendingImport.meta, caution=m.illustrative?'هذه خطة مقترحة بأرقام افتراضية أو غير مؤكدة. لا تعتبر أي مبلغ مستلمًا أو أي بند مسددًا حتى تسجله بنفسك.':'';
    const info=`${imported.plans.length} خطة، ${imported.items.length} بند، ${imported.payments.length} سداد مسجل`;
    show(`<h2>معاينة الاستيراد</h2>
      <p><b>${esc(textField(m.title||file.name,'عنوان الملف',200))}</b></p>
      <p class="note">${esc(info)}</p>
      ${caution?`<p class="note neg">${esc(caution)}</p>`:''}
      <p class="note"><b>تحديث البنود:</b> يضيف أي خطة أو بند غير موجود ويحدّث البنود المستوردة المطابقة، بما فيها مبالغ ومواعيد دفعاتها، مع إبقاء سجلات السداد والخطط الموجودة كما هي. راجع التغييرات إذا كنت عدّلت البنود يدويًا.</p>
      <p class="note"><b>دمج فقط:</b> يضيف العناصر الجديدة دون تعديل البنود الموجودة.</p>
      <p class="note"><b>استبدال:</b> يمسح بيانات مبالغي الحالية ويضع بيانات الملف مكانها. يُفضّل تصدير نسخة احتياطية أولًا.</p>
      <div class="actions">
        ${button('تحديث البنود ودمج الجديد','applyImport(\'update\')','')}
        ${button('إضافة غير الموجودة فقط','applyImport(\'merge\')')}
        ${button('استبدال كل البيانات','applyImport(\'replace\')','danger')}
        ${button('نسخة احتياطية أولًا','exportData()')}
        ${button('إلغاء','dismissModal(event)')}
      </div>`);
  }catch(err){pendingImport=null;alert('تعذر استيراد الملف: '+String(err.message||err).slice(0,210));}
}
function applyImport(mode){
  if(!pendingImport)return alert('اختر ملفًا للاستيراد أولًا');
  const source=pendingImport.model;
  let result,added={plans:0,items:0,payments:0},updatedItems=0;
  if(mode==='replace'){
    if(!confirm('سيتم حذف كل بيانات مبالغي الحالية واستبدالها ببيانات الملف. هل أنت متأكد؟'))return;
    if(!confirm('تأكيد أخير: هل تريد استبدال كل الخطط والبنود وسجلات السداد؟'))return;
    result=source;
  }else{
    if(mode==='update'&&!confirm('سيتم تحديث مبالغ وجداول البنود المتطابقة مع ملف الاستيراد، مع الإبقاء على خططك وسجلات السداد. هل تريد المتابعة؟'))return;
    result={plans:[...db.plans],items:[...db.items],payments:[...db.payments]};
    for(const key of ['plans','items','payments']){
      const oldIds=new Set(result[key].map(x=>x.id));
      for(const rec of source[key]){
        if(!oldIds.has(rec.id)){
          result[key].push(rec);oldIds.add(rec.id);added[key]++;
        }else if(mode==='update'&&key==='items'){
          const pos=result.items.findIndex(x=>x.id===rec.id);
          const old=result.items[pos];
          const oldSchedule=new Map(old.schedule.map(d=>[d.id,d]));
          const schedule=rec.schedule.map(d=>({...d,fundingPlanId:d.fundingPlanId||oldSchedule.get(d.id)?.fundingPlanId||''}));
          result.items[pos]={...old,name:rec.name,amount:rec.amount,note:rec.note,schedule,type:rec.type,cardRate:rec.cardRate,
            installmentFunding:{...(old.installmentFunding||{}),...(rec.installmentFunding||{})},
            installmentKinds:{...(old.installmentKinds||{}),...(rec.installmentKinds||{})}};
          updatedItems++;
        }
      }
    }
    try{validateImportedData(result)}catch(err){alert('تعذر تحديث البنود دون تعارض: '+err.message+' — لم تتغير بياناتك.');return;}
  }
  try{localStorage.setItem(KEY,JSON.stringify(result));}
  catch(err){alert('تعذر الحفظ على الجهاز؛ لم تتغير البيانات الأصلية. '+String(err.message||err).slice(0,100));return;}
  db=result;pendingImport=null;active=null;tab='dashboard';
  dismissModal();render();
  if(mode==='replace')alert('تم استبدال بيانات مبالغي بالملف المستورد بنجاح.');
  else alert(`تم الاستيراد: ${added.plans} خطة جديدة، و${added.items} بند جديد، و${updatedItems} بند محدّث، و${added.payments} سداد جديد.`);
}

if('serviceWorker'in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
}
render();
</script>
</body>
</html>
